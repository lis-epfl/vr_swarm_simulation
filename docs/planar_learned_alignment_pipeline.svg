<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#445"/>
    </marker>
    <style>
      .t  { font-size: 12.5px; font-weight: 700; fill: #1d2433; }
      .s  { font-size: 11px; fill: #3b4252; }
      .lane { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .note { font-size: 10.5px; fill: #4c566a; font-style: italic; }
      .box { fill: #ffffff; stroke: #5a6478; stroke-width: 1.2; }
      .ln  { stroke: #445; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="20" y="32" font-size="18" font-weight="700" fill="#1d2433">PLANAR learned alignment: the whole process</text>
  <text x="20" y="52" class="s">Two threads share one correction. The slow one works out where every drone really is; the fast one draws every frame with it.</text>

  <!-- input -->
  <rect x="20" y="80" width="112" height="470" rx="8" fill="#f4f1fb" stroke="#9a8cc4"/>
  <text x="76" y="104" text-anchor="middle" class="t">INPUT</text>
  <text x="76" y="124" text-anchor="middle" class="s">every frame,</text>
  <text x="76" y="139" text-anchor="middle" class="s">every drone:</text>
  <text x="76" y="166" text-anchor="middle" class="s">the image</text>
  <text x="76" y="186" text-anchor="middle" class="s">GNSS position</text>
  <text x="76" y="201" text-anchor="middle" class="s">compass heading</text>
  <text x="76" y="216" text-anchor="middle" class="s">gimbal angle</text>
  <text x="76" y="243" text-anchor="middle" class="s">+ the published</text>
  <text x="76" y="258" text-anchor="middle" class="s">plane (wall or</text>
  <text x="76" y="273" text-anchor="middle" class="s">ground)</text>
  <text x="76" y="306" text-anchor="middle" class="note">metres and</text>
  <text x="76" y="320" text-anchor="middle" class="note">degrees out</text>

  <!-- lane A: warp thread -->
  <rect x="146" y="80" width="794" height="212" rx="10" fill="#eef3fb" stroke="#9db3d6"/>
  <text x="160" y="101" class="lane" fill="#2f5597">WARP THREAD  ·  one update every 0.2–0.6 s  ·  planar_align.py</text>

  <rect class="box" x="158" y="116" width="118" height="112" rx="6"/>
  <text x="217" y="136" text-anchor="middle" class="t">1 Rectify</text>
  <text x="217" y="156" text-anchor="middle" class="s">resample each view</text>
  <text x="217" y="171" text-anchor="middle" class="s">onto a metre grid</text>
  <text x="217" y="186" text-anchor="middle" class="s">on the plane, so</text>
  <text x="217" y="201" text-anchor="middle" class="s">all look face-on at</text>
  <text x="217" y="216" text-anchor="middle" class="s">one scale</text>

  <rect class="box" x="288" y="116" width="118" height="112" rx="6"/>
  <text x="347" y="136" text-anchor="middle" class="t">2 SuperPoint</text>
  <text x="347" y="156" text-anchor="middle" class="s">CNN: keypoints,</text>
  <text x="347" y="171" text-anchor="middle" class="s">a 256-number</text>
  <text x="347" y="186" text-anchor="middle" class="s">fingerprint each,</text>
  <text x="347" y="201" text-anchor="middle" class="s">a dense map, and</text>
  <text x="347" y="216" text-anchor="middle" class="s">how rare each is</text>

  <rect class="box" x="418" y="116" width="118" height="112" rx="6" stroke-dasharray="5 3"/>
  <text x="477" y="136" text-anchor="middle" class="t">3 Shift graph</text>
  <text x="477" y="156" text-anchor="middle" class="s">drones = nodes,</text>
  <text x="477" y="171" text-anchor="middle" class="s">pairs = edges;</text>
  <text x="477" y="186" text-anchor="middle" class="s">one shift per drone</text>
  <text x="477" y="201" text-anchor="middle" class="s">so all pairs agree</text>
  <text x="477" y="216" text-anchor="middle" class="note">acquiring only</text>

  <rect class="box" x="548" y="116" width="118" height="112" rx="6"/>
  <text x="607" y="136" text-anchor="middle" class="t">4 Match pairs</text>
  <text x="607" y="156" text-anchor="middle" class="s">LightGlue (context)</text>
  <text x="607" y="171" text-anchor="middle" class="s">+ nearest neighbours</text>
  <text x="607" y="186" text-anchor="middle" class="s">near the expected</text>
  <text x="607" y="201" text-anchor="middle" class="s">spot; drop far</text>
  <text x="607" y="216" text-anchor="middle" class="s">background</text>

  <rect class="box" x="678" y="116" width="118" height="112" rx="6"/>
  <text x="737" y="136" text-anchor="middle" class="t">5 Bundle adjust</text>
  <text x="737" y="156" text-anchor="middle" class="s">rotation + position</text>
  <text x="737" y="171" text-anchor="middle" class="s">per drone and the</text>
  <text x="737" y="186" text-anchor="middle" class="s">plane's tilt and</text>
  <text x="737" y="201" text-anchor="middle" class="s">distance; GPS as</text>
  <text x="737" y="216" text-anchor="middle" class="s">a soft prior</text>

  <rect class="box" x="808" y="116" width="118" height="112" rx="6"/>
  <text x="867" y="136" text-anchor="middle" class="t">6 Period check</text>
  <text x="867" y="156" text-anchor="middle" class="s">is any view a whole</text>
  <text x="867" y="171" text-anchor="middle" class="s">window or storey</text>
  <text x="867" y="186" text-anchor="middle" class="s">out? move it,</text>
  <text x="867" y="201" text-anchor="middle" class="s">solve again; ties</text>
  <text x="867" y="216" text-anchor="middle" class="s">go to GPS</text>

  <line class="ln" x1="276" y1="172" x2="286" y2="172"/>
  <line class="ln" x1="406" y1="172" x2="416" y2="172"/>
  <line class="ln" x1="536" y1="172" x2="546" y2="172"/>
  <line class="ln" x1="666" y1="172" x2="676" y2="172"/>
  <line class="ln" x1="796" y1="172" x2="806" y2="172"/>
  <!-- re-solve loop -->
  <path class="ln" d="M 867 228 C 867 262, 737 262, 737 230"/>
  <text x="802" y="270" text-anchor="middle" class="note">re-solve</text>
  <text x="160" y="248" class="note">Acquiring: graph + wide gate (3 m), the published poses tried first.</text>
  <text x="160" y="263" class="note">Tracking: graph skipped, gate 1.5 m, a period check every 10th update.</text>
  <text x="160" y="278" class="note">Acquiring snaps to the answer; tracking low-passes it.</text>

  <!-- correction -->
  <rect x="300" y="308" width="626" height="46" rx="8" fill="#fff6e0" stroke="#c9a24a"/>
  <text x="613" y="327" text-anchor="middle" class="t">The correction</text>
  <text x="613" y="344" text-anchor="middle" class="s">per drone: rotation + position  ·  the plane  ·  an "anchor": each view's exact mapping for the frame it was solved on</text>
  <line class="ln" x1="867" y1="292" x2="867" y2="306"/>

  <!-- lane B: render thread -->
  <rect x="146" y="370" width="794" height="180" rx="10" fill="#eef7ef" stroke="#9cc7a2"/>
  <text x="926" y="391" text-anchor="end" class="lane" fill="#2e7d32">RENDER THREAD  ·  every frame (30 Hz)  ·  PlanarStitcher.py</text>

  <rect class="box" x="158" y="416" width="118" height="100" rx="6"/>
  <text x="217" y="436" text-anchor="middle" class="t">a Pose filter</text>
  <text x="217" y="456" text-anchor="middle" class="s">telemetry is 5 Hz</text>
  <text x="217" y="471" text-anchor="middle" class="s">and held: interpolate</text>
  <text x="217" y="486" text-anchor="middle" class="s">it to each frame's</text>
  <text x="217" y="501" text-anchor="middle" class="s">time</text>

  <rect class="box" x="288" y="416" width="118" height="100" rx="6"/>
  <text x="347" y="436" text-anchor="middle" class="t">b Image tracker</text>
  <text x="347" y="456" text-anchor="middle" class="s">each view's own</text>
  <text x="347" y="471" text-anchor="middle" class="s">motion since its</text>
  <text x="347" y="486" text-anchor="middle" class="s">anchor (optical flow,</text>
  <text x="347" y="501" text-anchor="middle" class="s">plane points only)</text>

  <rect class="box" x="418" y="416" width="118" height="100" rx="6"/>
  <text x="477" y="436" text-anchor="middle" class="t">c Homography</text>
  <text x="477" y="456" text-anchor="middle" class="s">one per view:</text>
  <text x="477" y="471" text-anchor="middle" class="s">motion since anchor</text>
  <text x="477" y="486" text-anchor="middle" class="s">× anchor mapping</text>
  <text x="477" y="501" text-anchor="middle" class="note">pose only if no anchor</text>

  <rect class="box" x="548" y="416" width="118" height="100" rx="6"/>
  <text x="607" y="436" text-anchor="middle" class="t">d Partition</text>
  <text x="607" y="456" text-anchor="middle" class="s">each pixel goes to the</text>
  <text x="607" y="471" text-anchor="middle" class="s">view that sees it most</text>
  <text x="607" y="486" text-anchor="middle" class="s">squarely; seams detour</text>
  <text x="607" y="501" text-anchor="middle" class="s">round disagreements</text>

  <rect class="box" x="678" y="416" width="118" height="100" rx="6"/>
  <text x="737" y="436" text-anchor="middle" class="t">e Multiband blend</text>
  <text x="737" y="456" text-anchor="middle" class="s">match exposures;</text>
  <text x="737" y="471" text-anchor="middle" class="s">fade only the</text>
  <text x="737" y="486" text-anchor="middle" class="s">low frequencies</text>
  <text x="737" y="501" text-anchor="middle" class="s">across seams</text>

  <rect class="box" x="808" y="416" width="118" height="100" rx="6"/>
  <text x="867" y="436" text-anchor="middle" class="t">f Panorama</text>
  <text x="867" y="456" text-anchor="middle" class="s">fitted canvas, drawn</text>
  <text x="867" y="471" text-anchor="middle" class="s">at feed resolution;</text>
  <text x="867" y="486" text-anchor="middle" class="s">Unity shows it on</text>
  <text x="867" y="501" text-anchor="middle" class="s">the curved VR screen</text>

  <line class="ln" x1="276" y1="466" x2="286" y2="466"/>
  <line class="ln" x1="406" y1="466" x2="416" y2="466"/>
  <line class="ln" x1="536" y1="466" x2="546" y2="466"/>
  <line class="ln" x1="666" y1="466" x2="676" y2="466"/>
  <line class="ln" x1="796" y1="466" x2="806" y2="466"/>
  <text x="160" y="538" class="note">A snapshot of the latest frames is handed to the warp thread whenever it is free.</text>

  <!-- correction into the render thread (drawn over the lane) -->
  <line class="ln" x1="347" y1="354" x2="347" y2="414"/>
  <text x="355" y="408" class="note">eased in over 0.3 s</text>

  <!-- input arrows -->
  <line class="ln" x1="132" y1="172" x2="156" y2="172"/>
  <line class="ln" x1="132" y1="466" x2="156" y2="466"/>

  <text x="20" y="582" class="note">Dashed box: runs only while acquiring a lock. Numbers and letters match the step-by-step text in planar_learned_alignment.md.</text>
</svg>
