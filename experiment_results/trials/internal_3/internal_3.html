<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>internal_3 Trial Results</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* The study pages' family: S4's page's styles, inlined at build (trials_report via swarmtune_report.s4_style),
   then the trial pages' additions. */

/* Layout: the study pages' family (S3's report) -- a masthead (the question, the findings) over a sticky tab bar, each
   tab a short intro over its tables and figures. Data colour: the two building variants (R teal, B violet), the
   surround modes on one blue ramp with aim-and-turn in orange, envelopment on one green ramp; pass / fail pills. */
:root {
  --bg: #f2f4f5; --panel: #fbfcfc; --ink: #111c25; --ink-2: #44525e; --muted: #7c8893; --line: #d6dde2;
  --grid: #e4e8eb; --chip: #e6ebee;
  --var-r: #1a8f84; --var-b: #8a4fb8;
  --m-soft: #7aaeea; --m-firm: #1f5fb6; --m-aim: #eb6834; --m-perim: #1a8f84; --m-other: #a9b3bb;
  --seq-0: #e3f1ea; --seq-1: #0b5e41;
  --good: #0c8a0c; --good-bg: #e2f3e2; --warn: #b77a00; --warn-bg: #fbf0d6; --bad: #c43535; --bad-bg: #f8e1e1;
  /* Phase 2's six conditions: the validated categorical order (dataviz palette slots 1-6), assigned in the order the
     page lists them, so neighbours in a legend or a bar list are the validated adjacent pairs */
  --c-street: #2a78d6; --c-hop: #eb6834; --c-pass: #1baf7a; --c-hold: #eda100; --c-single: #e87ba4; --c-look: #008300;
  --c-hop2: #6250d6;
  /* the maps (the Cities tab): asphalt streets, pale blocks, slate buildings, plazas as lawn, R's cylinders in R's teal */
  --map-street: #d9dfe3; --map-block: #f8f9f6; --map-edge: #eceeeb; --map-plaza: #e0ead6; --map-bldg: #6b7883;
  --map-cyl: #1a8f84;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1216; --panel: #141b20; --ink: #ecf1f4; --ink-2: #b3bec7; --muted: #7a8792; --line: #26313a;
    --grid: #1d262d; --chip: #1f2830;
    --var-r: #33b3a6; --var-b: #b07ddb;
    --m-soft: #649ff0; --m-firm: #bcd9fb; --m-aim: #f08a5d; --m-perim: #33b3a6; --m-other: #5d6b75;
    --seq-0: #18241f; --seq-1: #6fd3a7;
    --good: #5fd35f; --good-bg: #16301a; --warn: #f2c14e; --warn-bg: #33290f; --bad: #f07878; --bad-bg: #3a1a1a;
    --c-street: #3987e5; --c-hop: #d95926; --c-pass: #199e70; --c-hold: #c98500; --c-single: #d55181; --c-look: #008300;
    --c-hop2: #9085e9;
    --map-street: #0e1418; --map-block: #25303a; --map-edge: #1b242b; --map-plaza: #1f3829; --map-bldg: #66737e;
    --map-cyl: #33b3a6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1216; --panel: #141b20; --ink: #ecf1f4; --ink-2: #b3bec7; --muted: #7a8792; --line: #26313a;
  --grid: #1d262d; --chip: #1f2830;
  --var-r: #33b3a6; --var-b: #b07ddb;
  --m-soft: #649ff0; --m-firm: #bcd9fb; --m-aim: #f08a5d; --m-perim: #33b3a6; --m-other: #5d6b75;
  --seq-0: #18241f; --seq-1: #6fd3a7;
  --good: #5fd35f; --good-bg: #16301a; --warn: #f2c14e; --warn-bg: #33290f; --bad: #f07878; --bad-bg: #3a1a1a;
  --c-street: #3987e5; --c-hop: #d95926; --c-pass: #199e70; --c-hold: #c98500; --c-single: #d55181; --c-look: #008300;
  --c-hop2: #9085e9;
  --map-street: #0e1418; --map-block: #25303a; --map-edge: #1b242b; --map-plaza: #1f3829; --map-bldg: #66737e;
  --map-cyl: #33b3a6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 3.6vw, 2.7rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; font-weight: 600; line-height: 1.15; margin-bottom: 0.4rem; }
h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.25; margin-bottom: 0.35rem; }
p { margin: 0 0 0.65rem; max-width: 74ch; }
p:last-child { margin-bottom: 0; }
.eyebrow { font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 0.45rem; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.code { font-family: var(--font-mono); font-weight: 500; background: var(--chip); border-radius: 4px; padding: 0.05em 0.35em; white-space: nowrap; font-size: 0.88em; }

.masthead { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.15fr); gap: 28px; padding-block: 28px 22px; align-items: start; }
.lead { font-size: 1.03rem; color: var(--ink-2); margin-top: 0.7rem; }
.back { display: inline-block; margin: 0 0 12px; font: 500 0.88rem/1.2 var(--font-body); color: var(--ink-2); text-decoration: none; }
.back:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.back:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 0.84rem; color: var(--ink-2); }
.chip b { font: 600 0.92rem var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.findings { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.findings ul { margin: 0.3rem 0 0; padding-left: 1.1rem; display: grid; gap: 7px; }
.findings li { font-size: 0.93rem; color: var(--ink-2); }
.findings li b { color: var(--ink); font-weight: 600; }
@media (max-width: 900px) { .masthead { grid-template-columns: minmax(0, 1fr); } }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { appearance: none; border: 0; background: none; color: var(--ink-2); font: 600 0.98rem/1 var(--font-display); padding: 13px 12px 11px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab-btn:hover { color: var(--ink); }
.tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab-btn:focus-visible { outline: 2px solid var(--m-firm); outline-offset: -3px; }
.tab { padding-top: 24px; display: grid; gap: 22px; }
.intro { display: grid; gap: 4px; max-width: 82ch; }

.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }
th:first-child, td:first-child { text-align: left; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.l { text-align: left; font-family: var(--font-body); }
tr.sep td { border-top: 1px solid var(--line); }
.pill { display: inline-block; font: 600 0.72rem/1 var(--font-body); letter-spacing: 0.04em; border-radius: 999px; padding: 3px 8px; }
.pill.ok { color: var(--good); background: var(--good-bg); }
.pill.no { color: var(--bad); background: var(--bad-bg); }
.pill.na { color: var(--muted); background: var(--chip); }
.v-r { color: var(--var-r); font-weight: 600; }
.v-b { color: var(--var-b); font-weight: 600; }
.bad { color: var(--bad); }
.good { color: var(--good); }

.heat td.c { font-size: 0.8rem; min-width: 46px; position: relative; }
.heat td.c.star { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 600; }
.heat td.c .pred { position: absolute; left: 3px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--m-aim); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.84rem; color: var(--ink-2); align-items: center; }
.legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .ln { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid; margin-right: 5px; vertical-align: 3px; }
td .ln { display: inline-block; width: 14px; height: 0; border-top: 2.5px solid; margin-right: 7px; vertical-align: 3px; }

.picker { display: grid; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 500 0.88rem/1 var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; cursor: pointer; }
.seg button:hover { border-color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--m-firm); outline-offset: 1px; }
.dgrid { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; max-width: 420px; }
.dgrid .h { font: 600 0.7rem/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.dgrid button { font: 500 0.85rem/1 var(--font-mono); padding: 7px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); cursor: pointer; }
.dgrid button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-2); font: 500 11px var(--font-body); }
.chart .axis line, .chart .axis path { stroke: var(--line); }
.chart .gridl { stroke: var(--grid); }
.notrun { color: var(--muted); font-style: italic; }
.big { font: 600 1.9rem/1.05 var(--font-display); color: var(--ink); margin: 2px 0 6px; }
.verdict { font-weight: 600; color: var(--ink); }
.chart .val { fill: var(--ink); font: 500 11px var(--font-mono); }
.chart .lbl { fill: var(--ink-2); font: 500 12px var(--font-body); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:focus-visible { outline: none; stroke: var(--ink); stroke-width: 1; }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; font-size: 0.82rem; box-shadow: 0 3px 10px color-mix(in srgb, var(--ink) 14%, transparent); min-width: 170px; max-width: 320px; }
.tip .t { color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
.tip .tr { display: flex; align-items: center; gap: 8px; line-height: 1.5; }
.tip .tr b { font: 600 0.86rem var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 3.4em; text-align: right; }
.tip .tr span:last-child { color: var(--ink-2); }
.tip .k { display: inline-block; width: 14px; height: 0; border-top: 2px solid; flex: none; }
@media (prefers-reduced-motion: no-preference) { .tab { animation: fade 160ms ease-out; } }
@keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }

/* the key under the masthead: what the design codes and the two variants mean */
.key { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; padding-block: 0 20px; }
.key > div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.key svg { width: 92px; height: auto; display: block; }
.key p { font-size: 0.88rem; color: var(--ink-2); margin: 0; }
.key p b { color: var(--ink); }
.key .eyebrow { margin-bottom: 3px; color: var(--ink); }
.dcode { font-variant-numeric: tabular-nums; white-space: nowrap; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
a { color: inherit; text-decoration-color: var(--muted); text-underline-offset: 3px; }

/* the Look down tab: one small chart per design */
.ldgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 16px 24px; margin-top: 12px; }
.ldgrid > * { min-width: 0; }

/* the Cities tab */
.figframe { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.figframe canvas { display: block; width: 100%; touch-action: none; }
.thumbs { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; max-width: 960px; }
.thumbs .h { font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.thumbs .h.row { text-align: right; writing-mode: horizontal-tb; }
.thumb { appearance: none; padding: 0; border: 2px solid transparent; border-radius: 7px; background: none; cursor: pointer; display: grid; gap: 3px; text-align: left; color: var(--ink-2); font: 500 0.78rem/1.25 var(--font-body); min-width: 0; }
.thumb[aria-pressed="true"] { border-color: var(--ink); }
.thumb .figframe { border-radius: 5px; }
.thumb span { padding: 0 3px 3px; }
.cmap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 290px); gap: 14px; align-items: start; }
@media (max-width: 860px) { .cmap { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 0; font-size: 0.86rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kv .sub { grid-column: 1 / -1; font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.mapbar { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.mapbar button, .rv-mapbar button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); font: 600 16px/1 var(--font-body); cursor: pointer; }
.headrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.headrow h3 { margin: 0; }

/* the flight player (citysim/replay_view.js) */
.rv { display: grid; gap: 12px; }
.rv-head { display: grid; gap: 6px; }
.rv-picks .seg button .ln { margin-right: 6px; }
.rv-about p { color: var(--ink-2); max-width: 90ch; }
.rv-work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 290px); gap: 14px; align-items: start; }
@media (max-width: 900px) { .rv-work { grid-template-columns: minmax(0, 1fr); } }
.rv-fig { min-width: 0; display: grid; gap: 8px; }
.rv-frame { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.rv-frame canvas { display: block; width: 100%; touch-action: none; cursor: grab; }
.rv-frame canvas:focus-visible { outline: 2px solid var(--m-firm); outline-offset: -2px; }
.rv-mapbar { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.rv-loading { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: var(--panel); border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--ink-2); }
.rv-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rv-ctl input[type="range"] { flex: 1 1 220px; min-width: 140px; accent-color: var(--ink); }
.rv-ctl label { font-size: 0.86rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.rv-ctl select { font: 500 0.86rem var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
.rv-play { font: 600 0.9rem/1 var(--font-body); color: var(--panel); background: var(--ink); border: 1px solid var(--ink); border-radius: 5px; padding: 8px 14px; cursor: pointer; min-width: 76px; }
.rv-clock { font-size: 0.86rem; color: var(--ink-2); min-width: 92px; }
.rv-layers { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); }
.rv-layers label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.rv-side { display: grid; gap: 12px; min-width: 0; }
.rv-phase { font-weight: 600; color: var(--ink); margin: 2px 0 6px; font-size: 0.92rem; }
.rv-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; margin: 0; font-size: 0.85rem; }
.rv-kv dt { color: var(--ink-2); }
.rv-kv dd { margin: 0; text-align: right; max-width: 12em; }
.rv-tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; font-size: 0.82rem; color: var(--ink-2); box-shadow: 0 3px 10px color-mix(in srgb, var(--ink) 14%, transparent); max-width: 320px; }
.rv-tip .t { color: var(--ink); font-weight: 600; margin-bottom: 3px; }

/* the masthead's answer box */
.answer-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.answer-box .eyebrow { color: var(--ink); }
.answer-box ol { margin: 0.3rem 0 0; padding-left: 1.2rem; display: grid; gap: 8px; }
.answer-box li { font-size: 0.95rem; color: var(--ink-2); }
.answer-box li b { color: var(--ink); font-weight: 600; }
.answer-box .bottom { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 0.95rem; }

/* the Answer tab: the idea, five questions, the reading */
.ans { display: grid; gap: 22px; max-width: 1080px; }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 14px; min-width: 0; }
.qhead { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.qn { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--panel); display: grid; place-items: center; font: 600 1rem/1 var(--font-display); margin-top: 1px; }
.qhead h2 { margin-bottom: 4px; }
.qa { margin: 0; font-size: 1.02rem; color: var(--ink); max-width: 80ch; }
.vp { display: inline-block; font: 600 0.74rem/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 4px 9px; margin-right: 6px; vertical-align: 1px; }
.vp.yes { color: var(--good); background: var(--good-bg); }
.vp.part { color: var(--warn); background: var(--warn-bg); }
.vp.no { color: var(--bad); background: var(--bad-bg); }
.qbody { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .qbody { grid-template-columns: minmax(0, 1fr); } }
.qtext p, .qtext li { font-size: 0.93rem; color: var(--ink-2); }
.qtext ul { margin: 0 0 0.6rem; padding-left: 1.1rem; display: grid; gap: 5px; }
.qtext b { color: var(--ink); }
.watch { display: inline-flex; align-items: center; gap: 6px; font: 600 0.88rem/1.2 var(--font-body); color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; background: var(--bg); }
.watch:hover { border-color: var(--muted); }

      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="${T.line}"/>`;

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
try { const el = document.getElementById("rv-inline"); if (el) window.RV_INLINE = JSON.parse(el.textContent); } catch (e) { /* none */ }
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ok = x => x !== null && x !== undefined && !Number.isNaN(x);
const fmt = (x, nd = 2) => ok(x) ? Number(x).toFixed(nd) : "–";
const secs = x => ok(x) ? `${Math.round(x)} s` : "–";
const mmss = x => ok(x) ? `${Math.floor(x / 60)}:${String(Math.round(x % 60)).padStart(2, "0")}` : "–";
const pc = x => ok(x) ? `${Math.round(100 * x)}%` : "–";
const times = r => ok(r) ? `×${r.toFixed(2)}` : "–";
const pv = p => !ok(p) ? "–" : p < 0.001 ? "< 0.001" : p.toFixed(p < 0.1 ? 3 : 2);
const N = D.notes, ST = D.stats, RUNS = D.runs, PILOTS = D.pilots;
const CONDS = {swarm: "Swarm", single: "Single drone", sphere: "360 sphere"};
const kCol = c => `var(--k-${c || "single"})`;
const condOf = c => ({Swarm: "swarm", SingleDrone: "single", SingleSphere: "sphere"}[c] || "single");
const TITLE = r => `${r.pid}, flight ${r.order}: ${CONDS[condOf(r.condition)]} t${r.trial}${r.practice ? " (practice)" : ""}`;
const counted = RUNS.filter(r => !r.practice);
const PG = D.pages || {};

// ---------------------------------------------------------------- tooltip and chart helpers (S5's, as on S11's page)
const TIP = document.createElement("div");
TIP.className = "tip"; TIP.hidden = true; TIP.setAttribute("role", "status");
document.body.appendChild(TIP);
function tipShow(x, y, title, rows) {
  TIP.replaceChildren();
  const t = document.createElement("div"); t.className = "t"; t.textContent = title; TIP.appendChild(t);
  for (const [col, val, lab] of rows) {
    const r = document.createElement("div"); r.className = "tr";
    const k = document.createElement("span"); k.className = "k"; k.style.borderColor = col;
    const b = document.createElement("b"); b.textContent = val;
    const l = document.createElement("span"); l.textContent = lab;
    r.append(k, b, l); TIP.appendChild(r);
  }
  TIP.hidden = false;
  const pad = 14, w = TIP.offsetWidth, h = TIP.offsetHeight;
  let px = x + pad, py = y + pad;
  if (px + w > innerWidth - 8) px = x - w - pad;
  if (py + h > innerHeight - 8) py = y - h - pad;
  TIP.style.left = Math.max(8, px) + "px"; TIP.style.top = Math.max(8, py) + "px";
}
function tipHide() { TIP.hidden = true; }
function hoverMarks(root, rowsFor) {
  root.querySelectorAll("[data-i]").forEach(m => {
    const i = +m.dataset.i;
    m.addEventListener("pointermove", ev => { const [t, rows] = rowsFor(i); tipShow(ev.clientX, ev.clientY, t, rows); });
    m.addEventListener("pointerleave", tipHide);
    m.addEventListener("focus", () => { const b = m.getBoundingClientRect(), [t, rows] = rowsFor(i); tipShow(b.right, b.top, t, rows); });
    m.addEventListener("blur", tipHide);
  });
}
const cw = (el, lo = 260, hi = 1080) => Math.max(lo, Math.min(hi, Math.round(el.clientWidth || 640)));
function observe(el, draw) {
  let w = 0;
  new ResizeObserver(() => { const n = Math.round(el.clientWidth); if (n && Math.abs(n - w) > 24) { w = n; requestAnimationFrame(draw); } }).observe(el);
}
const svgOf = (Wd, H, label, g) => `<svg viewBox="0 0 ${Wd} ${H}" style="max-width:${Wd}px" role="img" aria-label="${esc(label)}">${g}</svg>`;
function niceMax(v) { const s = [10, 20, 25, 50, 100, 120, 150, 200, 250, 300, 400, 500, 600, 750, 900, 1000, 1200]; const step = s.find(x => v / x <= 5) || 300; return {step, top: Math.ceil(v / step) * step}; }

// Every run of each pilot by flight order, its value as a dot in its condition's colour (hollow: practice).
function orderChart(el, get, unit, label) {
  const per = PILOTS.map(p => RUNS.filter(r => r.pid === p).sort((a, b) => a.order - b.order));
  const vals = RUNS.map(get).filter(ok), {step, top} = niceMax(Math.max(1, ...vals) * 1.05);
  const n = per.length, total = cw(el), pw = Math.max(200, Math.floor(total / Math.min(n, Math.max(1, Math.floor(total / 230)))) - 14);
  const H = 230, m = {l: 46, r: 10, t: 12, b: 34};
  const yy = v => m.t + (H - m.t - m.b) * (1 - v / top);
  const all = [];
  const panel = (runs, pi) => {
    const k = runs.length, xx = j => m.l + (pw - m.l - m.r) * (j + 0.5) / Math.max(1, k);
    let g = "";
    for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="gridl" x1="${m.l}" x2="${pw - m.r}" y1="${yy(v)}" y2="${yy(v)}"/><text x="${m.l - 6}" y="${yy(v) + 4}" text-anchor="end">${v}</text>`;
    g += `<text x="${m.l - 34}" y="${m.t + 2}" text-anchor="start" style="font-size:10px">${esc(unit)}</text>`;
    runs.forEach((r, j) => {
      const v = get(r), c = kCol(condOf(r.condition));
      g += `<text x="${xx(j)}" y="${H - m.b + 16}" text-anchor="middle">${r.order}</text>`;
      if (!ok(v)) { g += `<text x="${xx(j)}" y="${yy(0) - 4}" text-anchor="middle" class="val">–</text>`; return; }
      const i = all.length; all.push(r);
      g += r.practice ? `<circle cx="${xx(j)}" cy="${yy(v)}" r="5.5" fill="var(--panel)" stroke="${c}" stroke-width="2"/>`
                      : `<circle cx="${xx(j)}" cy="${yy(v)}" r="6" fill="${c}"/>`;
      g += `<circle class="hit" data-i="${i}" tabindex="0" cx="${xx(j)}" cy="${yy(v)}" r="11"/>`;
    });
    g += `<text x="${(m.l + pw - m.r) / 2}" y="${H - 4}" text-anchor="middle" style="font-size:10px">flight, in the order flown</text>`;
    return `<div><h4>${esc(PILOTS[pi])}</h4>${svgOf(pw, H, `${label}: ${PILOTS[pi]}`, g)}</div>`;
  };
  el.innerHTML = `<div class="pair">${per.map(panel).join("")}</div>`;
  hoverMarks(el, i => { const r = all[i]; return [TITLE(r), [[kCol(condOf(r.condition)), unit === "s" ? secs(get(r)) : fmt(get(r), 1), label]]]; });
}

// Each goal (or leg) of every counted run, by pilot and condition: dots placed by leg, the median a bar.
function goalChart(el, key, label) {
  const G = D.goals.filter(g => !g.practice);
  const vals = G.map(g => g[key]).filter(ok), {step, top} = niceMax(Math.max(1, ...vals) * 1.05);
  const n = PILOTS.length, total = cw(el), pw = Math.max(200, Math.floor(total / Math.min(n, Math.max(1, Math.floor(total / 230)))) - 14);
  const H = 230, m = {l: 46, r: 10, t: 12, b: 30};
  const yy = v => m.t + (H - m.t - m.b) * (1 - v / top);
  const all = [], cols = ["single", "swarm"];
  const panel = pid => {
    const xx = ci => m.l + (pw - m.l - m.r) * (ci + 0.5) / cols.length, span = (pw - m.l - m.r) / cols.length * 0.6;
    let g = "";
    for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="gridl" x1="${m.l}" x2="${pw - m.r}" y1="${yy(v)}" y2="${yy(v)}"/><text x="${m.l - 6}" y="${yy(v) + 4}" text-anchor="end">${v}</text>`;
    g += `<text x="${m.l - 34}" y="${m.t + 2}" text-anchor="start" style="font-size:10px">s</text>`;
    cols.forEach((c, ci) => {
      const gs = G.filter(x => x.pid === pid && x.cond === c).sort((a, b) => a.order - b.order || a.leg - b.leg);
      const orders = [...new Set(gs.map(x => x.order))];
      g += `<text x="${xx(ci)}" y="${H - m.b + 16}" text-anchor="middle">${CONDS[c]}</text>`;
      const v = gs.map(x => x[key]).filter(ok).sort((a, b) => a - b);
      if (v.length) { const med = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
        g += `<line x1="${xx(ci) - span / 2 - 6}" x2="${xx(ci) + span / 2 + 6}" y1="${yy(med)}" y2="${yy(med)}" stroke="var(--ink)" stroke-width="2"/>`; }
      gs.forEach(x => {
        if (!ok(x[key])) return;
        const oi = orders.indexOf(x.order), off = ((oi + 0.5) / Math.max(1, orders.length) - 0.5) * span + (x.leg - 2) * 3;
        const i = all.length; all.push(x);
        g += `<circle cx="${(xx(ci) + off).toFixed(1)}" cy="${yy(x[key]).toFixed(1)}" r="4.6" fill="${kCol(c)}" fill-opacity="0.85"/>`;
        g += `<circle class="hit" data-i="${i}" tabindex="0" cx="${(xx(ci) + off).toFixed(1)}" cy="${yy(x[key]).toFixed(1)}" r="8"/>`;
      });
    });
    return `<div><h4>${esc(pid)}</h4>${svgOf(pw, H, `${label}: ${pid}`, g)}</div>`;
  };
  el.innerHTML = `<div class="pair">${PILOTS.map(panel).join("")}</div><p class="small muted">One dot per goal of each counted run, spread by run (in the order flown); the bar is the median.</p>`;
  hoverMarks(el, i => { const x = all[i]; return [`${x.pid}, flight ${x.order}: the ${x.hat || "goal"} (leg ${x.leg})`, [[kCol(x.cond), secs(x[key]), label]]]; });
}

// The swarm / single-drone ratio, each pilot's and the pooled, on a log axis.
function ratioStrip(el, s) {
  if (!s) { el.innerHTML = ""; return; }
  const rs = s.per.map(p => p.ratio).concat([s.ratio]);
  let lo = 0.25, hi = 4; while (Math.min(...rs) < lo) lo /= 2; while (Math.max(...rs) > hi) hi *= 2;
  const Wd = Math.min(640, cw(el)), H = 62, m = {l: 14, r: 14, t: 18, b: 20};
  const xx = r => m.l + (Wd - m.l - m.r) * (Math.log(r) - Math.log(lo)) / (Math.log(hi) - Math.log(lo));
  let g = `<line x1="${m.l}" x2="${Wd - m.r}" y1="${m.t + 12}" y2="${m.t + 12}" stroke="var(--line)"/>`;
  for (let r = lo; r <= hi * 1.0001; r *= 2) g += `<line x1="${xx(r)}" x2="${xx(r)}" y1="${m.t + 6}" y2="${m.t + 18}" stroke="${Math.abs(r - 1) < 1e-9 ? "var(--ink)" : "var(--line)"}" stroke-width="${Math.abs(r - 1) < 1e-9 ? 1.6 : 1}"/><text x="${xx(r)}" y="${H - 4}" text-anchor="middle">×${r >= 1 ? r : r.toFixed(r < 0.25 ? 3 : 2)}</text>`;
  g += `<text x="${m.l}" y="10" style="font-size:10px">← swarm sooner</text><text x="${Wd - m.r}" y="10" text-anchor="end" style="font-size:10px">swarm slower →</text>`;
  s.per.forEach((p, i) => { g += `<circle cx="${xx(p.ratio)}" cy="${m.t + 12}" r="4.5" fill="var(--panel)" stroke="var(--ink-2)" stroke-width="1.6"/><circle class="hit" data-i="${i}" tabindex="0" cx="${xx(p.ratio)}" cy="${m.t + 12}" r="9"/>`; });
  const x = xx(s.ratio), y = m.t + 12;
  g += `<path d="M${x} ${y - 7} L${x + 7} ${y} L${x} ${y + 7} L${x - 7} ${y} Z" fill="var(--ink)"/><circle class="hit" data-i="${s.per.length}" tabindex="0" cx="${x}" cy="${y}" r="9"/>`;
  el.innerHTML = svgOf(Wd, H, "swarm time over single-drone time", g) + `<p class="small muted">Swarm ÷ single drone: ◇ each pilot's ratio of geometric means, ◆ pooled over the pilots.</p>`;
  hoverMarks(el, i => i < s.per.length ? [`${s.per[i].pid}`, [["var(--ink-2)", times(s.per[i].ratio), `swarm ${secs(s.per[i].gm_s)} (${s.per[i].n_s} runs) against ${secs(s.per[i].gm_d)} (${s.per[i].n_d})`]]]
    : ["Pooled", [["var(--ink)", times(s.ratio), `over ${s.n_pilots} pilots; p ${pv(s.p)} (the design's smallest ${pv(s.floor)})`]]]);
}

// Small-multiple horizontal bars (S11's): rows [{c, lab, ...}], panels [{title, get, f, unit?}]
function barPanels(el, rows, panels) {
  const Wd = Math.max(220, Math.min(380, Math.floor(cw(el) / Math.min(panels.length, Math.max(1, Math.floor(cw(el) / 230)))) - 12));
  const bh = 15, gap = 6, m = {l: 112, r: 58, t: 4, b: 6}, H = m.t + rows.length * (bh + gap) - gap + m.b;
  const panel = (p, pi) => {
    const vals = rows.map(x => p.get(x)), vmax = Math.max(1e-9, ...vals.filter(ok)) * 1.05;
    const xx = v => m.l + (Wd - m.l - m.r) * Math.max(0, v) / vmax;
    let g = "";
    rows.forEach((x, i) => {
      const v = vals[i], yy = m.t + i * (bh + gap);
      g += `<text class="lbl" x="${m.l - 8}" y="${yy + bh / 2 + 4}" text-anchor="end">${esc(x.lab)}</text>`;
      if (ok(v)) {
        g += `<rect x="${m.l}" y="${yy}" width="${Math.max(1.5, xx(v) - m.l).toFixed(1)}" height="${bh}" rx="2" fill="${kCol(x.c)}"/>`;
        g += `<text class="val" x="${(xx(v) + 5).toFixed(1)}" y="${yy + bh - 3}">${p.f(v)}</text>`;
      } else g += `<text class="val" x="${m.l + 4}" y="${yy + bh - 3}">–</text>`;
      g += `<rect class="hit" data-i="${pi * 100 + i}" tabindex="0" x="0" y="${yy}" width="${Wd}" height="${bh}"/>`;
    });
    return `<div><h4>${esc(p.title)}</h4>${svgOf(Wd, H, p.title, g)}${p.unit ? `<p class="small muted">${esc(p.unit)}</p>` : ""}</div>`;
  };
  el.innerHTML = `<div class="pair">${panels.map(panel).join("")}</div>`;
  hoverMarks(el, k => { const p = panels[Math.floor(k / 100)], x = rows[k % 100]; return [x.lab, [[kCol(x.c), p.f(p.get(x)), p.title]]]; });
}

function verdict(s) {

function oneLine(key) {

// Per pilot: the condition flown later (by its runs' mean flight order) against the one flown earlier, in total time.
function orderEffect() {
  const mean = v => v.reduce((a, b) => a + b, 0) / v.length;
  return PILOTS.map(p => {
    const rs = counted.filter(r => r.pid === p && ok(r.time_s) && r.time_s > 0), of = c => rs.filter(r => condOf(r.condition) === c);
    if (!of("swarm").length || !of("single").length) return null;
    const later = mean(of("swarm").map(r => r.order)) > mean(of("single").map(r => r.order)) ? "swarm" : "single";
    const earlier = later === "swarm" ? "single" : "swarm", gm = c => Math.exp(mean(of(c).map(r => Math.log(r.time_s))));
    return {pid: p, later, ratio: gm(later) / gm(earlier)};
  }).filter(Boolean);
}
function orderText() {
  const E = orderEffect();
  if (!E.length) return "";
  const faster = E.filter(e => e.ratio < 0.95).length, level = E.filter(e => e.ratio >= 0.95 && e.ratio <= 1.05).length;
  const n = E.length, who = k => k === n ? (n === 2 ? "both pilots were" : "every pilot was") : k === 1 ? "one pilot was" : `${k} pilots were`;
  return `Here ${E.map(e => `${esc(e.pid)} flew the ${e.later === "swarm" ? "swarm" : "single drone"} later and took ${times(e.ratio)} of the earlier condition's time`).join("; ")}:
    ${faster ? `${who(faster)} quicker in the condition flown later` : "no pilot was quicker in the condition flown later"}${level ? `, ${who(level).replace(" were", "").replace(" was", "")} level (within 5%)` : ""}.`;
}
const median = v => { v = v.filter(ok).sort((a, b) => a - b); return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null; };

  if (c.session) parts.push(`never crossed in ${c.session}, which are timed from Play`);

    if (!S) return `<h3>${esc(capTitle("setups", "Each pilot's setup"))}</h3><p class="notrun">The runs carry no settings.</p>${cap("setups")}`;
    const rows = S.rows.map(x => `<tr${x.differs ? ' class="diff"' : ""}><td class="l">${esc(x.key)}</td>${x.vals.map(v => `<td class="l mono">${esc(v)}</td>`).join("")}</tr>`).join("");
    return `<h3>${esc(capTitle("setups", "Each pilot's setup"))}</h3>
      <p class="small">What each pilot's first run recorded about itself; the rows that differ are shaded.</p>
      <div class="tablewrap"><table class="dt"><thead><tr><th class="l"></th>${S.pilots.map(p => `<th class="l">${esc(p)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>${cap("setups")}`;
  },
  legs() {
    const L = D.long_legs || [];
    const rows = k => L.filter(x => x.kind === k).map(x => `<tr><td class="l">${esc(x.pid)}, flight ${x.order}</td><td class="l"><span class="dot" style="background:${kCol(condOf(x.condition))}"></span>${CONDS[condOf(x.condition)]}</td><td class="l">${esc(x.hat || "–")} (leg ${x.leg})</td><td>${secs(x.s)}</td><td>${watch(x.run, "watch")}</td></tr>`).join("");
    return `<h3>${esc(capTitle("legs", "The longest legs"))}</h3>
      <div class="tablewrap"><table class="dt"><thead><tr><th class="l">run</th><th class="l"></th><th class="l">goal</th><th>time</th><th></th></tr></thead>
        <tbody><tr class="sep"><td class="l" colspan="5"><b>At a goal</b></td></tr>${rows("at a goal")}<tr class="sep"><td class="l" colspan="5"><b>Between goals</b></td></tr>${rows("between goals")}</tbody></table></div>${cap("legs")}`;
  },
  other(id) { return `<h3>${esc(capTitle(id, id))}</h3>${cap(id)}`; }
};
function reasonText(x) {
  const t = {CollidingWithAnotherDrone: "collision", ExternallyKilled: "collision", TooFarFromSwarm: "too far from the others", Crashed: "crashed"}[x.reason] || x.reason || "–";
  return x.partner !== null && x.partner !== undefined && x.partner >= 0 ? `${t} with ${x.partner + 1}` : t;
}
function smoothBars(el) {
  const rows = PILOTS.flatMap(p => ["single", "swarm"].map(c => {
    const xs = counted.filter(r => r.pid === p && condOf(r.condition) === c);
    if (!xs.length) return null;
    const mean = k => { const v = xs.map(r => r[k]).filter(ok); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    return {c, lab: `${p} · ${CONDS[c]}`, tv: mean("stick_tv_per_min"), adj: mean("adj_per_min"), turn: mean("course_turn_per_min"), path: mean("act_path_ratio")};
  })).filter(Boolean);
  barPanels(el, rows, [{title: "Stick movement per minute", get: x => x.tv, f: v => fmt(v, 0)},
                       {title: "Adjustments per minute", get: x => x.adj, f: v => fmt(v, 1)},
                       {title: "Course turned per minute (°)", get: x => x.turn, f: v => fmt(v, 0)},
                       {title: "Flown path ÷ straight line", get: x => x.path, f: v => fmt(v, 2)}]);
}

// ---------------------------------------------------------------- what changed
RENDER.changes = el => {
  const link = t => t && PG[t] ? `<a class="watch" href="${PG[t]}" target="_blank" rel="noopener">${esc(t)}</a>` : t ? `<span class="code">${esc(t)}</span>` : "";
  el.innerHTML = `<div class="intro"><h2>${esc(N.changes_title || "What changed")}</h2>
      <p>The main changes a pilot would meet, from the commits between the two series (each change's commit beside it). Changes that touched nothing a pilot sees are left out.</p></div>
    <div class="areas">${(N.changes || []).map(a => `<div class="box"><h3>${esc(a.area)}</h3><ul>${a.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>
    ${(N.within || []).length ? `<div class="box"><h3>Within the series</h3><ul class="small">${N.within.map(i => `<li>${i}</li>`).join("")}</ul></div>` : ""}
    ${N.setup ? `<div class="box"><h3>The setup, side by side</h3><div class="tablewrap"><table class="dt"><thead><tr>${N.setup.head.map((h, i) => `<th class="l">${h}</th>`).join("")}</tr></thead>
      <tbody>${N.setup.rows.map(r => `<tr>${r.map(c => `<td class="l">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>` : ""}
    <div class="navrow">${D.nav.prev ? `<span class="small">The series before: ${link(D.nav.prev)}</span>` : ""}${D.nav.next ? `<span class="small">The series after: ${link(D.nav.next)}</span>` : ""}</div>`;
};

// ---------------------------------------------------------------- flights
const RPATH = {city: n => `replay/cities/${n}.json`, flight: n => `replay/flights/${n}.json`};
RENDER.flights = el => {
  if (!D.replay || !D.replay.groups.length) { el.innerHTML = `<p class="notrun">No flights to replay.</p>`; return; }
  el.innerHTML = `<div class="intro"><h2>Every run, replayed</h2><p>Each run as the recorder logged it: every drone's position and heading ten times a second (drawn every
      ${0.2} s), its feed shown or not, the goals with their zones, the start line, each press where the formation's centre was, and each drone lost. Pick a pilot, then a run;
      the clock is the recording's, from Play, and the panel beside the map gives the task clock from the start line. Under the map the green band marks the time at a goal.
      Space plays or pauses, ← and → step 5 s.</p></div><div id="c-player"></div>`;
  const labels = {swarm: "Swarm", single: "Single drone", sphere: "360 sphere"}, colors = {swarm: kCol("swarm"), single: kCol("single"), sphere: kCol("sphere")};
  PLAYER = RV.Player($("#c-player", el), D.replay.groups, {labels, colors, path: RPATH, summaryRows: flightRows, summaryNote: flightNote});
  PLAYER.start(0);
};
function flightRows(F, s) {
  const r = [];
  if (D.timed) r.push(["total time", `${secs(s.time_s)}${s.time_source === "duration" ? " (to the recording's end)" : ""}`]);
  r.push(["recorded", mmss(s.duration)], ["start line crossed", ok(s.start) ? `${mmss(s.start)} after Play${s.start_source === "derived" ? " (derived)" : ""}` : "never"],
         ["at the goals", secs(s.search_s)], ["between goals", secs(s.transit_s)], ["goal zones reached", `${s.reached} of ${s.goals}`]);
  if (D.timed) r.push(["answered correctly", `${s.correct} of ${s.goals}`], ["false alarms", String(s.false_alarms)]);
  r.push(["drones lost", `${s.lost} of ${s.drones}`]);
  if (s.practice) r.push(["practice", "yes: counted in no summary"]);
  return r;
}
function flightNote(F) {
  return "A drone's dot is filled while its feed was on the pilot's screens. Presses are drawn where the formation's centre was, coloured by how the recorder scored them.";
}

// ---------------------------------------------------------------- all results
RENDER.details = el => {
  const tbl = (title, head, body, note = "") => `<div class="box"><h3>${esc(title)}</h3><div class="tablewrap"><table class="dt"><thead><tr>${head.map((h, i) => `<th${i < 2 ? ' class="l"' : ""}>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>${note}</div>`;
  const runRows = RUNS.slice().sort((a, b) => a.pid.localeCompare(b.pid) || a.order - b.order).map(r => `<tr${r.practice ? ' class="prac"' : ""}>
    <td class="l">${esc(r.pid)}, flight ${r.order}</td><td class="l"><span class="dot" style="background:${kCol(condOf(r.condition))}"></span>${CONDS[condOf(r.condition)]} t${r.trial}${r.practice ? " · practice" : ""}</td>
    <td>${mmss(r.durationSec)}</td><td>${ok(r.startSec) ? mmss(r.startSec) : "–"} <span class="muted">${esc(r.startSource || "")}</span></td>
    <td>${D.timed ? secs(r.time_s) : "–"}</td><td>${secs(r.search_s)}</td><td>${secs(r.transit_s)}</td><td>${r.goalsReached}/${r.nGoals}</td>
    <td>${ok(r.nCorrect) ? r.nCorrect : "–"}</td><td>${ok(r.falseAlarms) ? r.falseAlarms : "–"}</td><td>${ok(r.drones_lost) ? r.drones_lost : "–"}</td><td>${watch(r.run, "watch")}</td></tr>`).join("");
  const goalRows = D.goals.slice().sort((a, b) => a.pid.localeCompare(b.pid) || a.order - b.order || a.leg - b.leg).map(g => `<tr${g.practice ? ' class="prac"' : ""}>
    <td class="l">${esc(g.pid)}, flight ${g.order}</td><td class="l">${CONDS[g.cond]}</td><td class="l">${esc(g.hat || "–")}</td><td>${g.leg}</td><td>${secs(g.transit)}</td><td>${secs(g.search)}</td>
    <td class="l">${esc(g.outcome || "–")}</td><td>${ok(g.decision) ? mmss(g.decision) : "–"}</td></tr>`).join("");
  const smRows = RUNS.slice().sort((a, b) => a.pid.localeCompare(b.pid) || a.order - b.order).map(r => `<tr${r.practice ? ' class="prac"' : ""}><td class="l">${esc(r.pid)}, flight ${r.order}</td><td class="l">${CONDS[condOf(r.condition)]}</td>
    <td>${fmt(r.stick_tv_per_min, 1)}</td><td>${fmt(r.adj_per_min, 1)}</td><td>${fmt(r.mean_hold_s, 1)}</td><td>${fmt(r.course_turn_per_min, 0)}</td><td>${fmt(r.cmd_straightness, 2)}</td><td>${fmt(r.act_path_ratio, 2)}</td></tr>`).join("");
  const notes = (N.data_notes || []).map(x => `<li>${x}</li>`).join("") + (D.warnings || []).slice(0, 40).map(w => `<li class="muted mono small">${esc(w)}</li>`).join("");
  el.innerHTML = `<div class="intro"><h2>All results</h2><p>Every number on the page, run by run. The same tables are written beside the page (experiment_results/trials/${esc(D.test)}/tables).</p></div>
    ${tbl("Runs", ["run", "", "recorded", "start line", "total time", "at goals", "between goals", "zones", "correct", "false alarms", "lost", ""], runRows,
      `<p class="small muted">"Start line" is when it was crossed after Play: <i>line</i> as the recorder logged it, <i>derived</i> from the drone logs for runs before it existed, <i>session</i> never crossed (timed from Play).</p>`)}
    ${tbl("Goals, in the order reached", ["run", "", "hat", "leg", "between goals", "at the goal", "outcome", "answered at"], goalRows,
      `<p class="small muted">The leg's time between goals is the way to this goal; "answered at" is on the recording's clock.</p>`)}
    ${tbl("How the pilot flew, run by run (between goals)", ["run", "", "stick / min", "adjustments / min", "hold (s)", "course turn °/min", "straightness", "path ratio"], smRows)}
    <div class="box"><h3>Data notes</h3><ul class="small">${notes || "<li>none</li>"}</ul></div>`;
};

// ---------------------------------------------------------------- terms
const TERMS = [
  ["The task", [
    ["The task", "Find the three walkers wearing a hat (a cowboy hat, a cap, a bucket hat), each at one of three goal patches somewhere in the city, and identify each: the pilot presses the RC's C2 button (from internal_3 on), or calls it out."],
    ["Swarm, single drone", "Ten drones flown as one formation, every edge drone's camera on a screen round the pilot; or one drone with its one camera in front. The same sticks fly both."],
    ["Practice run", "A run test.json marks as practice (a pilot's first in each condition, where they were recorded): drawn on the charts, hollow, and left out of every summary and ratio."],
    ["Flight order", "The runs of one pilot, numbered in the order flown. The trial number the run's name carries counts differently in different series."]]],
  ["The times", [
    ["Start line", "A line 30 m ahead of the spawn; the first drone to cross it starts the task. Recorded from 26 October 2026; before that, the same crossing is found in the drone logs (derived). Take-off and looking round before it are not timed."],
    ["Total time", "From the start line to the last answer press; where answers were not pressed (internal_2), to the end of the recording, which the experimenter stopped at the last answer."],
    ["Goal zone", "A goal's patch (a city tile, or a block-shaped city's ring of buildings) grown by 15 m: the whole street round it. Position is the formation's centre (alive drones), or the single drone."],
    ["Time at a goal", "From entering a goal's zone to the last time it is left before the next goal's zone is entered (for the last goal, its last exit). Leaving and coming back still counts as at the goal."],
    ["Time between goals", "From leaving one goal's zone to entering the next; the first leg runs from the start line. With the time at the goals it covers the run from the start line to the last goal's last exit, which can differ from the total time by the moments after the last answer."],
    ["Ratio, pooled", "Swarm ÷ single drone: per pilot the ratio of the geometric means of their runs, pooled as the geometric mean over the pilots, so each pilot counts once."],
    ["p (permutation)", "The share of all relabellings of which runs were the swarm's, within each pilot and keeping the numbers of runs, that give a pooled ratio at least as far from 1. With two pilots and two runs each there are 36, so p cannot go below 2/36 = 0.056: no difference can be significant at 0.05 in such a design."]]],
  ["How the pilot flew", [
    ["Stick movement per minute", "The total travel of the four-axis stick vector per minute (dead-banded): control activity, without thresholds. Between goals only."],
    ["Adjustments per minute", "Discrete re-settings: the stick leaves its held position by more than 0.2 and settles 0.5 s at a new one. Push and hold is one; constant re-steering is many."],
    ["Time between adjustments", "How long one command was held."],
    ["Course turned per minute", "Total change of the commanded direction (while commanding at least 30% speed)."],
    ["Command straightness", "The commanded displacement over the commanded path length: 1 is one heading held for a whole leg."],
    ["Flown path ÷ straight line", "The path the formation's centre flew over the straight distance to the goal's zone; the swarm bends its own path round buildings."]]],
  ["The replays", [
    ["Shown feed", "A drone whose camera was on the pilot's screens: recorded from 12 October 2026, rebuilt from the convex-hull rule before."],
    ["Press", "An identify press, drawn where the formation's centre was and coloured by the recorder's score: correct, a false alarm, or outside every goal's zone."]]]];
RENDER.terms = el => {
  el.innerHTML = `<div class="intro"><h2>Terms</h2></div><div class="terms">` + TERMS.map(([h, items]) => `<div class="box"><h3>${esc(h)}</h3><dl>${items.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("")}</dl></div>`).join("")
    + `</div><p class="small muted">Built ${esc(D.built)} by Assets/Scripts/Experiment/trials_report.py from the runs in the experiment folder's ${esc(D.test)} (analyse.py, every run timed from the start line); the prose is docs/trials/${esc(D.test)}.md.</p>`;
};

MASTHEAD();
let first = "results";
try { const t = localStorage.getItem(TABKEY); if (t && TABS.some(x => x[0] === t)) first = t; } catch (e) { /* private window */ }
if (!route(location.hash.slice(1))) show(first);
</script>
</body></html>
