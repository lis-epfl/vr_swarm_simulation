<title>S9 Street Spread Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* The study pages' family: S4's page's styles, inlined at build (swarmspread_review via swarmtune_report.s4_style),
   then this page's additions. The settings keep S9's colours: 2.0 held the neutral, the scene green, 1.7 held blue,
   the other adaptive rows purple; 1.8 held takes the family's one remaining slot. */

/* Layout: the study pages' family (S3's report) -- a masthead (the question, the findings) over a sticky tab bar, each
   tab a short intro over its tables and figures. Data colour: the two building variants (R teal, B violet), the
   surround modes on one blue ramp with aim-and-turn in orange, envelopment on one green ramp; pass / fail pills. */
:root {
  --bg: #f2f4f5; --panel: #fbfcfc; --ink: #111c25; --ink-2: #44525e; --muted: #7c8893; --line: #d6dde2;
  --grid: #e4e8eb; --chip: #e6ebee;
  --var-r: #1a8f84; --var-b: #8a4fb8;
  --m-soft: #7aaeea; --m-firm: #1f5fb6; --m-aim: #eb6834; --m-perim: #1a8f84; --m-other: #a9b3bb;
  --seq-0: #e3f1ea; --seq-1: #0b5e41;
  --good: #0c8a0c; --good-bg: #e2f3e2; --warn: #b77a00; --warn-bg: #fbf0d6; --bad: #c43535; --bad-bg: #f8e1e1;
  /* Phase 2's six conditions: the validated categorical order (dataviz palette slots 1-6), assigned in the order the
     page lists them, so neighbours in a legend or a bar list are the validated adjacent pairs */
  --c-street: #2a78d6; --c-hop: #eb6834; --c-pass: #1baf7a; --c-hold: #eda100; --c-single: #e87ba4; --c-look: #008300;
  --c-hop2: #6250d6;
  /* the maps (the Cities tab): asphalt streets, pale blocks, slate buildings, plazas as lawn, R's cylinders in R's teal */
  --map-street: #d9dfe3; --map-block: #f8f9f6; --map-edge: #eceeeb; --map-plaza: #e0ead6; --map-bldg: #6b7883;
  --map-cyl: #1a8f84;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1216; --panel: #141b20; --ink: #ecf1f4; --ink-2: #b3bec7; --muted: #7a8792; --line: #26313a;
    --grid: #1d262d; --chip: #1f2830;
    --var-r: #33b3a6; --var-b: #b07ddb;
    --m-soft: #649ff0; --m-firm: #bcd9fb; --m-aim: #f08a5d; --m-perim: #33b3a6; --m-other: #5d6b75;
    --seq-0: #18241f; --seq-1: #6fd3a7;
    --good: #5fd35f; --good-bg: #16301a; --warn: #f2c14e; --warn-bg: #33290f; --bad: #f07878; --bad-bg: #3a1a1a;
    --c-street: #3987e5; --c-hop: #d95926; --c-pass: #199e70; --c-hold: #c98500; --c-single: #d55181; --c-look: #008300;
    --c-hop2: #9085e9;
    --map-street: #0e1418; --map-block: #25303a; --map-edge: #1b242b; --map-plaza: #1f3829; --map-bldg: #66737e;
    --map-cyl: #33b3a6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1216; --panel: #141b20; --ink: #ecf1f4; --ink-2: #b3bec7; --muted: #7a8792; --line: #26313a;
  --grid: #1d262d; --chip: #1f2830;
  --var-r: #33b3a6; --var-b: #b07ddb;
  --m-soft: #649ff0; --m-firm: #bcd9fb; --m-aim: #f08a5d; --m-perim: #33b3a6; --m-other: #5d6b75;
  --seq-0: #18241f; --seq-1: #6fd3a7;
  --good: #5fd35f; --good-bg: #16301a; --warn: #f2c14e; --warn-bg: #33290f; --bad: #f07878; --bad-bg: #3a1a1a;
  --c-street: #3987e5; --c-hop: #d95926; --c-pass: #199e70; --c-hold: #c98500; --c-single: #d55181; --c-look: #008300;
  --c-hop2: #9085e9;
  --map-street: #0e1418; --map-block: #25303a; --map-edge: #1b242b; --map-plaza: #1f3829; --map-bldg: #66737e;
  --map-cyl: #33b3a6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 3.6vw, 2.7rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; font-weight: 600; line-height: 1.15; margin-bottom: 0.4rem; }
h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.25; margin-bottom: 0.35rem; }
p { margin: 0 0 0.65rem; max-width: 74ch; }
p:last-child { margin-bottom: 0; }
.eyebrow { font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 0.45rem; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.code { font-family: var(--font-mono); font-weight: 500; background: var(--chip); border-radius: 4px; padding: 0.05em 0.35em; white-space: nowrap; font-size: 0.88em; }

.masthead { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.15fr); gap: 28px; padding-block: 28px 22px; align-items: start; }
.lead { font-size: 1.03rem; color: var(--ink-2); margin-top: 0.7rem; }
.back { display: inline-block; margin: 0 0 12px; font: 500 0.88rem/1.2 var(--font-body); color: var(--ink-2); text-decoration: none; }
.back:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.back:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 0.84rem; color: var(--ink-2); }
.chip b { font: 600 0.92rem var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.findings { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.findings ul { margin: 0.3rem 0 0; padding-left: 1.1rem; display: grid; gap: 7px; }
.findings li { font-size: 0.93rem; color: var(--ink-2); }
.findings li b { color: var(--ink); font-weight: 600; }
@media (max-width: 900px) { .masthead { grid-template-columns: minmax(0, 1fr); } }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { appearance: none; border: 0; background: none; color: var(--ink-2); font: 600 0.98rem/1 var(--font-display); padding: 13px 12px 11px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab-btn:hover { color: var(--ink); }
.tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab-btn:focus-visible { outline: 2px solid var(--m-firm); outline-offset: -3px; }
.tab { padding-top: 24px; display: grid; gap: 22px; }
.intro { display: grid; gap: 4px; max-width: 82ch; }

.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }
th:first-child, td:first-child { text-align: left; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.l { text-align: left; font-family: var(--font-body); }
tr.sep td { border-top: 1px solid var(--line); }
.pill { display: inline-block; font: 600 0.72rem/1 var(--font-body); letter-spacing: 0.04em; border-radius: 999px; padding: 3px 8px; }
.pill.ok { color: var(--good); background: var(--good-bg); }
.pill.no { color: var(--bad); background: var(--bad-bg); }
.pill.na { color: var(--muted); background: var(--chip); }
.v-r { color: var(--var-r); font-weight: 600; }
.v-b { color: var(--var-b); font-weight: 600; }
.bad { color: var(--bad); }
.good { color: var(--good); }

.heat td.c { font-size: 0.8rem; min-width: 46px; position: relative; }
.heat td.c.star { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 600; }
.heat td.c .pred { position: absolute; left: 3px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--m-aim); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.84rem; color: var(--ink-2); align-items: center; }
.legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .ln { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid; margin-right: 5px; vertical-align: 3px; }
td .ln { display: inline-block; width: 14px; height: 0; border-top: 2.5px solid; margin-right: 7px; vertical-align: 3px; }

.picker { display: grid; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 500 0.88rem/1 var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; cursor: pointer; }
.seg button:hover { border-color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--m-firm); outline-offset: 1px; }
.dgrid { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; max-width: 420px; }
.dgrid .h { font: 600 0.7rem/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.dgrid button { font: 500 0.85rem/1 var(--font-mono); padding: 7px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); cursor: pointer; }
.dgrid button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-2); font: 500 11px var(--font-body); }
.chart .axis line, .chart .axis path { stroke: var(--line); }
.chart .gridl { stroke: var(--grid); }
.notrun { color: var(--muted); font-style: italic; }
.big { font: 600 1.9rem/1.05 var(--font-display); color: var(--ink); margin: 2px 0 6px; }
.verdict { font-weight: 600; color: var(--ink); }
.chart .val { fill: var(--ink); font: 500 11px var(--font-mono); }
.chart .lbl { fill: var(--ink-2); font: 500 12px var(--font-body); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:focus-visible { outline: none; stroke: var(--ink); stroke-width: 1; }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; font-size: 0.82rem; box-shadow: 0 3px 10px color-mix(in srgb, var(--ink) 14%, transparent); min-width: 170px; max-width: 320px; }
.tip .t { color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
.tip .tr { display: flex; align-items: center; gap: 8px; line-height: 1.5; }
.tip .tr b { font: 600 0.86rem var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 3.4em; text-align: right; }
.tip .tr span:last-child { color: var(--ink-2); }
.tip .k { display: inline-block; width: 14px; height: 0; border-top: 2px solid; flex: none; }
@media (prefers-reduced-motion: no-preference) { .tab { animation: fade 160ms ease-out; } }
@keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }

/* the key under the masthead: what the design codes and the two variants mean */
.key { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; padding-block: 0 20px; }
.key > div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.key svg { width: 92px; height: auto; display: block; }
.key p { font-size: 0.88rem; color: var(--ink-2); margin: 0; }
.key p b { color: var(--ink); }
.key .eyebrow { margin-bottom: 3px; color: var(--ink); }
.dcode { font-variant-numeric: tabular-nums; white-space: nowrap; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
a { color: inherit; text-decoration-color: var(--muted); text-underline-offset: 3px; }

/* the Look down tab: one small chart per design */
.ldgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 16px 24px; margin-top: 12px; }
.ldgrid > * { min-width: 0; }

/* the Cities tab */
.figframe { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.figframe canvas { display: block; width: 100%; touch-action: none; }
.thumbs { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; max-width: 960px; }
.thumbs .h { font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.thumbs .h.row { text-align: right; writing-mode: horizontal-tb; }
.thumb { appearance: none; padding: 0; border: 2px solid transparent; border-radius: 7px; background: none; cursor: pointer; display: grid; gap: 3px; text-align: left; color: var(--ink-2); font: 500 0.78rem/1.25 var(--font-body); min-width: 0; }
.thumb[aria-pressed="true"] { border-color: var(--ink); }
.thumb .figframe { border-radius: 5px; }
.thumb span { padding: 0 3px 3px; }
.cmap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 290px); gap: 14px; align-items: start; }
@media (max-width: 860px) { .cmap { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 0; font-size: 0.86rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kv .sub { grid-column: 1 / -1; font: 600 0.72rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.mapbar { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.mapbar button, .rv-mapbar button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); font: 600 16px/1 var(--font-body); cursor: pointer; }
.headrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.headrow h3 { margin: 0; }

/* the flight player (citysim/replay_view.js) */
.rv { display: grid; gap: 12px; }
.rv-head { display: grid; gap: 6px; }
.rv-picks .seg button .ln { margin-right: 6px; }
.rv-about p { color: var(--ink-2); max-width: 90ch; }
.rv-work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 290px); gap: 14px; align-items: start; }
@media (max-width: 900px) { .rv-work { grid-template-columns: minmax(0, 1fr); } }
.rv-fig { min-width: 0; display: grid; gap: 8px; }
.rv-frame { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.rv-frame canvas { display: block; width: 100%; touch-action: none; cursor: grab; }
.rv-frame canvas:focus-visible { outline: 2px solid var(--m-firm); outline-offset: -2px; }
.rv-mapbar { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.rv-loading { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: var(--panel); border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--ink-2); }
.rv-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rv-ctl input[type="range"] { flex: 1 1 220px; min-width: 140px; accent-color: var(--ink); }
.rv-ctl label { font-size: 0.86rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.rv-ctl select { font: 500 0.86rem var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
.rv-play { font: 600 0.9rem/1 var(--font-body); color: var(--panel); background: var(--ink); border: 1px solid var(--ink); border-radius: 5px; padding: 8px 14px; cursor: pointer; min-width: 76px; }
.rv-clock { font-size: 0.86rem; color: var(--ink-2); min-width: 92px; }
.rv-layers { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); }
.rv-layers label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.rv-side { display: grid; gap: 12px; min-width: 0; }
.rv-phase { font-weight: 600; color: var(--ink); margin: 2px 0 6px; font-size: 0.92rem; }
.rv-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; margin: 0; font-size: 0.85rem; }
.rv-kv dt { color: var(--ink-2); }
.rv-kv dd { margin: 0; text-align: right; max-width: 12em; }
.rv-tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; font-size: 0.82rem; color: var(--ink-2); box-shadow: 0 3px 10px color-mix(in srgb, var(--ink) 14%, transparent); max-width: 320px; }
.rv-tip .t { color: var(--ink); font-weight: 600; margin-bottom: 3px; }

/* the masthead's answer box */
.answer-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.answer-box .eyebrow { color: var(--ink); }
.answer-box ol { margin: 0.3rem 0 0; padding-left: 1.2rem; display: grid; gap: 8px; }
.answer-box li { font-size: 0.95rem; color: var(--ink-2); }
.answer-box li b { color: var(--ink); font-weight: 600; }
.answer-box .bottom { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 0.95rem; }

/* the Answer tab: the idea, five questions, the reading */
.ans { display: grid; gap: 22px; max-width: 1080px; }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 14px; min-width: 0; }
.qhead { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.qn { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--panel); display: grid; place-items: center; font: 600 1rem/1 var(--font-display); margin-top: 1px; }
.qhead h2 { margin-bottom: 4px; }
.qa { margin: 0; font-size: 1.02rem; color: var(--ink); max-width: 80ch; }
.vp { display: inline-block; font: 600 0.74rem/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 4px 9px; margin-right: 6px; vertical-align: 1px; }
.vp.yes { color: var(--good); background: var(--good-bg); }
.vp.part { color: var(--warn); background: var(--warn-bg); }
.vp.no { color: var(--bad); background: var(--bad-bg); }
.qbody { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .qbody { grid-template-columns: minmax(0, 1fr); } }
.qtext p, .qtext li { font-size: 0.93rem; color: var(--ink-2); }
.qtext ul { margin: 0 0 0.6rem; padding-left: 1.1rem; display: grid; gap: 5px; }
.qtext b { color: var(--ink); }
.watch { display: inline-flex; align-items: center; gap: 6px; font: 600 0.88rem/1.2 var(--font-body); color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; background: var(--bg); }
.watch:hover { border-color: var(--muted); }
.watch::before { content: "▶"; font-size: 0.7rem; color: var(--ink-2); }

<script>/* citysim/replay_view.js -- plays back the flights citysim/playback.py records, over the cities they flew in.

   the street centreline samples a flight's first-seen times index. Flight: frames every dt of every drone's position,

  }

  function city(c) {
    if (c._d) return c._d;
    const d = { id: c.id, arena: c.arena, v: c.variant, p: c.p, s: c.s, seed: c.seed, stats: c.stats || {}, anatomy: c.anatomy || null };
    d.blocks = polys(c.blocks); d.bld = polys(c.buildings);
    d.flags = c.block_flags ? bytes(c.block_flags) : new Uint8Array(d.blocks.length);

    d.ell = c.ellipses ? Float32Array.from(i16(c.ellipses), v => v / 10) : null;   // S10: cx, cz, a, b, axis angle (deg)
    d.samples = c.samples ? Float32Array.from(i16(c.samples), v => v / 10) : null;

    d.seen = f.seen ? u16(f.seen) : null;

    // sights index the city's street samples

  function droneAt(F, fr, i) {
    if (fr.i0 >= F.alive_to[i]) return null;
    const a = fr.i1 < F.alive_to[i] ? fr.a : 0, n = F.n, k0 = (fr.i0 * n + i) * 2, k1 = (fr.i1 * n + i) * 2;
    const y0 = F.yaw[fr.i0 * n + i] * 360 / 256, y1 = F.yaw[fr.i1 * n + i] * 360 / 256;
    let dy = ((y1 - y0 + 540) % 360) - 180;

  function drones(F, t) { const fr = frameAt(F, t), out = []; for (let i = 0; i < F.n; i++) { const d = droneAt(F, fr, i); if (d) out.push(d); } return out; }
  function apartAt(F, t) { if (!F.apartMask) return 0; const A = F.apart, k = Math.max(0, Math.min(F.apartMask.length - 1, Math.floor((t - A.t0) / A.dt + 1e-6))); return F.apartMask[k]; }
  function aliveCount(F, t) { const fr = frameAt(F, t); let m = 0; for (let i = 0; i < F.n; i++) if (fr.i0 < F.alive_to[i]) m++; return m; }

  const findM = F => F.find_m || 80;
  const foundAt = F => { const v = F.found && F.found[`r${findM(F)}`]; return v === null || v === undefined ? null : v; };
  const fmtT = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`; };

  const TOKENS = ["bg", "panel", "ink", "ink-2", "muted", "line", "grid", "chip", "map-street", "map-block", "map-edge",
    "map-plaza", "map-bldg", "map-cyl", "good", "warn", "bad"];

    const m = /^var\((--[\w-]+)\)$/.exec(String(v).trim());

// Small-multiple horizontal bars from zero: one panel per measure, one bar per row; an optional interval per bar.
function barPanels(el, rows, panels, legend) {
  const W = Math.max(220, Math.min(380, Math.floor(cw(el) / Math.min(panels.length, Math.max(1, Math.floor(cw(el) / 230)))) - 12));
  const bh = 16, gap = 7, m = {l: 122, r: 60, t: 4, b: 6}, H = m.t + rows.length * (bh + gap) - gap + m.b;
  const panel = (p, pi) => {
    const vals = rows.map(x => p.get(x.r)), iv = rows.map(x => p.ci ? p.ci(x.r) : null);
    const vmax = Math.max(1e-9, ...vals.filter(ok), ...iv.filter(Boolean).map(v => v[1])) * 1.05;
    const xx = v => m.l + (W - m.l - m.r) * Math.max(0, v) / vmax;
    let g = `<line class="gridl" x1="${m.l}" x2="${m.l}" y1="0" y2="${H}"/>`;
    rows.forEach((x, i) => {
      const v = vals[i], yy = m.t + i * (bh + gap);
      g += `<text class="lbl" x="${m.l - 8}" y="${yy + bh / 2 + 4}" text-anchor="end">${esc(x.lab || nm(x.c))}</text>`;
      if (ok(v)) {
        g += `<rect x="${m.l}" y="${yy}" width="${Math.max(1.5, xx(v) - m.l).toFixed(1)}" height="${bh}" rx="2" fill="${COL(x.c)}"/>`;
        const ci = iv[i];
        if (ci) g += `<line class="ival" x1="${xx(ci[0]).toFixed(1)}" x2="${xx(ci[1]).toFixed(1)}" y1="${yy + bh / 2}" y2="${yy + bh / 2}"/>
          <line class="ival" x1="${xx(ci[1]).toFixed(1)}" x2="${xx(ci[1]).toFixed(1)}" y1="${yy + 4}" y2="${yy + bh - 4}"/>`;
        g += `<text class="val" x="${(xx(ci ? Math.max(v, ci[1]) : v) + 5).toFixed(1)}" y="${yy + bh - 3}">${p.f(v)}</text>`;
      } else g += `<text class="val" x="${m.l + 4}" y="${yy + bh - 3}">–</text>`;
      g += `<rect class="hit" data-i="${pi * 100 + i}" tabindex="0" x="0" y="${yy}" width="${W}" height="${bh}"/>`;
    });
    return `<div><h4>${esc(p.title)}</h4>${svgOf(W, H, p.title, g)}${p.unit ? `<p class="small muted">${esc(p.unit)}</p>` : ""}</div>`;
  };
  el.innerHTML = `${legend || ""}<div class="pair">${panels.map(panel).join("")}</div>`;
  hoverMarks(el, k => { const p = panels[Math.floor(k / 100)], x = rows[k % 100], ci = p.ci ? p.ci(x.r) : null;
    return [x.tip || x.lab || nm(x.c), [[COL(x.c), p.f(p.get(x.r)) + (ci ? ` (95%: ${p.f(ci[0])} to ${p.f(ci[1])})` : ""), p.title]]]; });
}

function forest(el, rows) {
  const W = cw(el, 300, 760), narrow = W < 560;
  const m = {l: narrow ? 128 : 238, r: narrow ? 96 : 124, t: 26, b: 30}, rh = 25;
  const H = m.t + rows.length * rh + m.b, L0 = Math.log(0.25), L1 = Math.log(4);
  const xx = v => m.l + (W - m.l - m.r) * (Math.log(Math.min(4, Math.max(0.25, v))) - L0) / (L1 - L0);

  rows.forEach((x, i) => {

}

        <li><b>In a trial</b>: at 2.0 held Unity loses one event (nearly always a pair) per ${f(kmPerEvent, 1)} km of full-stick street flight. A 50% rise would be one more pair per ${f(kmPerEvent * 2, 0)} km.</li></ul>
        <div class="watches">${watch("s9_a85", "a85", "The route where 0.85 lost the most in Unity")}</div></div></div>
  </section>

  <section class="q" id="q3">
    <div class="qhead"><span class="qn">3</span><div><h2>Does it touch buildings less and hold together better?</h2>
      <p class="qa">${pill("yes", "Yes")}The clearest effects in the study, in Unity and the replica alike.</p></div></div>
    <div class="qbody"><div class="chart" id="ans-hold"></div>
      <div class="qtext"><ul>
        <li><b>Contacts</b>: ${A85U.contacts} against ${F20U.contacts} on the same ${UP.n} Unity routes, ${fewer(UP.contacts.ratio)} fewer (bootstrap over routes ${fewer(UP.contacts.hi)}–${fewer(UP.contacts.lo)}, paired ${pv(UP.contacts.p)});
          ${UP.contacts.flights_a} flights with a contact against ${UP.contacts.flights_b}. The replica agrees (${fewer(RP.A85.contact_km / RP.F20.contact_km)} fewer), and 1.7 held touches least
          (${fewer(RP.F17.contact_km / RP.F20.contact_km)} fewer). A contact costs no drone in the simulation, but in Unity friction can pin a drone against a facade.</li>
        <li><b>Splitting</b>: in Unity the swarm is in more than one group ${pc0(A85U.split)} of the flight against ${pc0(F20U.split)} (${pv(UP.split.p)}).</li>
        <li><b>What the pilot sees</b>: ${f(100 * UP.hull.diff, 0)} points more of the drones sit on the hull, whose feeds the ring shows (${pc0(A85U.hull)} against ${pc0(F20U.hull)}: about half a feed more),
          and the pilot's look direction is as well covered (the nearest shown feed ${f(A85U.look, 1)}° off it against ${f(F20U.look, 1)}°, ${pv(UP.look.p)}).</li></ul></div></div>
  </section>

  <section class="q" id="q4">
    <div class="qhead"><span class="qn">4</span><div><h2>Is the adaptive spread better than holding 1.7?</h2>
      <p class="qa">${pill("no", "No sign")}On every measure the study took, holding 1.7 the whole flight does at least as well.</p></div></div>
    <div class="qbody"><div class="chart" id="ans-f17"></div>
      <div class="qtext"><ul>
        <li><b>What the adaptive spread is for</b>: narrowing in the streets for speed, and widening back at buildings so the formation can surround them. The comparison that tests the widening is against 1.7 held, not 2.0 held.</li>
        <li><b>Replica</b> (${RP.A85.n} flights each): the same loss events (${RP.F17.events} and ${RP.A85.events}), 1.7 held ${pct(RPP["F17-A85"].vprog.pct)} quicker on the street routes (on ${pc0(RPP["F17-A85"].vprog.higher)} of them),
          ${fewer(RP.F17.contacts / RP.A85.contacts)} fewer contacts (${RP.F17.contacts} against ${RP.A85.contacts}), and buildings surrounded ${pct(RP.F17.wrap)} against ${pct(RP.A85.wrap)}.
          The widening buys ${f(RP.A85.cov - RP.F17.cov, 0)}° more of the bearing round a building covered (${f(RP.A85.cov, 0)}° against ${f(RP.F17.cov, 0)}°).</li>
        <li><b>Unity</b> (${UF.n} street routes each, the first two benches): ${F17U.events} loss events against ${UN.ratio_f17_a85.k0}, 1.7 held ${pct(UF.vprog.pct)} quicker (${pv(UF.vprog.p)}), contacts ${rrs(UF.contacts)}.</li>
        <li>S9 says 1.7 held "is not cleared" because Unity flew it only ${F17U.n} times. That is fair, but the same evidence shows no advantage for the adaptive spread over it,
          while the adaptive spread adds moving parts: the narrowing has no floor under the pilot's dial (<a href="#q6">question 6</a>).</li></ul></div></div>
  </section>

  <section class="q" id="q5">
    <div class="qhead"><span class="qn">5</span><div><h2>Do the narrowing and widening themselves cost drones?</h2>
      <p class="qa">${pill("part", "No sign")}Nothing points to it, but the test cannot see a moderate effect.</p></div></div>
    <div class="qbody one"><div class="qtext"><ul>
        <li><b>The strongest evidence is the held rows</b>: in the replica the adaptive 0.85 loses exactly what 1.7 held loses (${RP.A85.events} and ${RP.F17.events}), though it only reaches 1.7 once settled in a street.</li>
        <li><b>S9's timing test</b> asks whether losses crowd into the moments the spread is changing, using the shadow of what the adaptive spread would be doing in every row. It finds the place matters
          (the first seconds in a street, in every row) and the change does not (narrowing against the rest: replica p = ${f(PHS.replica.contrast_p, 2)}, Unity p = ${f(PHS.unity.contrast_p, 2)}).
          That reading is reasonable, but at ${RP.F20.events}–${RP.A85.events} events a row a 50% extra cost in the changing moments would not be detected.</li>
        <li><b>S9 did not report Unity's omnibus test</b> (do the four phases share one ratio?): p = ${f(PHS.unity.omnibus_p, 2)}, driven by ${PHS.unity.wide.a} losses against ${PHS.unity.wide.b} in the moments the adaptive spread is held wide.
          The replica shows the opposite there (${PHS.replica.wide.a} against ${PHS.replica.wide.b}). Read as noise either way; neither supports "cost nothing" or its opposite.</li></ul></div></div>
  </section>

  <section class="q" id="q6">
    <div class="qhead"><span class="qn">6</span><div><h2>What about the pilot's dial?</h2>
      <p class="qa">${pill("part", "Not tested")}Every conclusion above is at d_ref 2.0. Pilots turn the dial, and the adaptive spread multiplies whatever they set.</p></div></div>
    <div class="qbody one"><div class="qtext"><ul>
        <li><b>The narrowing has no floor</b> (<code>OlfatiSaber.EffectiveDRef</code>): the trials' lowest dial setting, 1.4, becomes ${f(STREET.L85, 2)} in the streets.</li>
        <li><b>Only the first replica run flew it</b> (${f(R1.F20.km, 0)} km a row): the four rows with 1.2–1.4 in the streets lost ${DIAL.events} events in ${f(DIAL.km, 0)} km against ${R1.F20.events} in ${f(R1.F20.km, 0)} at 2.0 held
          (×${f((DIAL.events / DIAL.km) / (R1.F20.events / R1.F20.km), 2)}), and surrounded ${pc0(DIAL.wrapLo)}–${pc0(DIAL.wrapHi)} of the buildings they met against ${pc0(R1.F20.wrap)}. Unity flew the dial at 1.4 with 0.85 on ${UR.L85.n} street routes (${UR.L85.events} loss events).</li>
        <li>Whether it matters depends on how often pilots sit there, which the internal tests' dial logs can answer without flying anything.</li></ul>
        <div class="watches">${watch("s9_l85", "l85", "The dial at 1.4 with the adaptive spread")}</div></div></div>
  </section>

  <section class="q" id="q7">
    <div class="qhead"><span class="qn">7</span><div><h2>Is further study needed?</h2>
      <p class="qa">${pill("part", "To claim either way")}Not to keep flying the trials as they are; yes, before saying the adaptive spread helps or that it is harmless.</p></div></div>
    <div class="qbody one"><div class="qtext">
      <ol class="plan">
        <li><div><b>One Unity run, three settings head to head.</b> The scene (0.85), 1.7 held and 2.0 held, about 1,500 fresh street routes and 100 straight lines each
          (${plan.toLocaleString("en")} flights, about ${f(hours(plan), 0)} hours on the bench at the settling run's pace: one night). Primary: loss events per km, 0.85 against 2.0 held and against 1.7 held,
          judged on this run alone by a rule written first. Secondary: near misses under ${f(D.near_m, 2)} m, contacts, progress speed, buildings surrounded.
          <p class="small muted">Chance of detecting a 50% rise, and of excluding one when there is none: ${powerLine(1.5)}. A 30% rise is out of reach in one night (${powerLine(1.3)}).</p></div></li>
        <li><div><b>Find out why the replica and Unity disagree on losses</b>, before the replica's loss counts choose another setting (S6–S9 all did). Replica only, about an hour:
          fly the twins' routes from the replica's own settled start to see whether the 2.0-held gap closes (${TO.F20.twin} twin flights with losses in ${TO.F20.twin_n} against ${TO.F20.own} in ${TO.F20.own_n} of its own in the same city),
          and attribute the forces at each loss in both.</div></li>
        <li><div><b>Look at the dial before flying it.</b> If the internal tests' logs show pilots below about 1.6 for long, fly 1.4 with and without the adaptive spread in Unity, or give
          <code>EffectiveDRef</code> a floor (a law change, which means the replica and the bench with it).</div></li>
        <li><div><b>Optional: does any of it reach the trial?</b> A hidden-target search in this city (S2's harness) would show whether a 3% progress gain and fewer splits change how soon the swarm finds a target. Without it, the speed gain's value to the trials is assumed.</div></li></ol>
      <p>If the first run is not flown, the scene's setting is a reasonable default: its gains are measured, its loss cost is somewhere between none and moderate, and 1.7 held has the same uncertainty with fewer Unity flights behind it.</p></div></div>
  </section>

  <section class="q reading" id="reading">
    <div><h2>My reading</h2>
      <p class="qa">S9's data are sound and plentiful, and most of its measurements hold. Its write-up is stronger than the data in three places: it reports cohesive speed as speed,
        it reads "no significant difference in ${F20U.n} routes" as "no cost", and it explains away the replica's loss doubling with a cause the flights do not support. The
        conclusion it reached, to keep the scene as it is, survives as a reasonable default. Its justification does not.</p></div>
    <div class="grid2">
      <div><h3>What S9 settles</h3><ol>
        <li><b>A narrower street spread is quicker</b>, by about 3% in progress, and keeps the swarm together more of the time.</li>
        <li><b>It touches buildings less</b>, by about 40% in Unity, and keeps more drones on the hull.</li>
        <li><b>The adaptive spread at 0.85 flies the streets like 1.8 held</b>, and loses like 1.7 held.</li></ol></div>
      <div><h3>What it cannot settle</h3><ol>
        <li><b>Whether narrower costs drones in Unity</b>: anywhere from ${f(UN.ratio.lo, 1)} to ${f(UN.ratio.hi, 1)} times as many.</li>
        <li><b>Whether the adaptive spread beats holding 1.7</b>: no advantage measured, ${F17U.n} Unity routes.</li>
        <li><b>People</b>: scripted pilots at full stick, the dial fixed at 2.0.</li></ol></div></div>
    <div id="claims"><h3>S9's claims, checked against the flights</h3>${claimsTable()}</div>
  </section></div>`;

      <td>${c === "F20" ? "–" : rrs(RRT[c])}</td><td>${r.flights_lost}</td><td>${f(r.contact_km, 2)}</td><td>${pct(r.near)}</td><td>${pc0(r.hull)}</td><td>${pct(r.wrap)}</td><td>${f(r.cov, 0)}°</td>
      <td>${["1", "2", "3", "4"].map(s => r.by_seed[s] ?? "–").join(" · ")}</td></tr>`; }).join("");
  const pairs = ["A95-F20", "A90-F20", "A85-F20", "F18-F20", "F17-F20", "F17-A85", "F18-A85"].map(k => { const p = RPP[k], [a, b] = k.split("-");
    return `<tr><td class="l">${esc(nm(a))} against ${esc(nm(b))}</td><td>${p.vprog.n}</td><td>${pct(p.vprog.pct)} (${pct(p.vprog.lo)} to ${pct(p.vprog.hi)})</td><td>${pc0(p.vprog.higher)}</td>
      <td>${f(100 * p.one, 1)}</td><td>${pct(p.vcoh.pct)} (${pct(p.vcoh.lo)} to ${pct(p.vcoh.hi)})</td><td>${pc0(p.vcoh.higher)}</td></tr>`; }).join("");
  const uni = ["F20", "A95", "A90", "A85", "F17", "L85"].filter(c => UR[c]).map(c => { const r = UR[c], ci = ci100(r);
    return `<tr><td class="l">${esc(nm(c))}</td><td>${r.n}</td><td>${f(r.km, 0)}</td><td>${r.events} (${r.coll} · ${r.crashed})</td><td>${f(per100(r), 1)} (${f(ci[0], 1)}–${f(ci[1], 1)})</td><td>${r.flights_lost}</td>
      <td>${f(r.contact_km, 2)}</td><td>${f(r.vprog, 2)}</td><td>${pc0(r.one)}</td><td>${f(r.vcoh, 2)}</td><td>${pct(r.near)}</td><td>${f(r.min_pair, 2)}</td><td>${f(r.near_ticks, 0)}</td>
      <td>${pc0(r.hull)}</td><td>${pc0(r.split)}</td><td>${f(r.look, 1)}°</td><td>${r.twin_flights_lost} (${r.both_lost})</td></tr>`; }).join("");
  const cmp = [["Unity, three benches, loss events", UN.ratio], ["Unity, the fresh bench only (flown after the settling rule)", UN.ratio_fresh],
    ["Unity, the first two benches (seen before the rule)", UN.ratio_earlier], ["Unity, collisions between drones only", UN.ratio_coll],
    ["Unity, flights that lost drones", UN.ratio_flights], [`Unity, loss events after the first ${f(TM.cut, 0)} s`, TM.unity_late],
    ["Unity's replica twins, flights that lost drones", UN.ratio_twin], ["The replica's own flights (run2), loss events", RRT.A85],
    [`The replica's own flights, after the first ${f(TM.cut, 0)} s (street routes)`, TM.replica_late], ["Replica and Unity combined (fixed effect)", CB],
    ["1.7 held against 2.0 held, Unity (two benches)", UN.ratio_f17], ["1.7 held against 0.85, Unity (two benches)", UN.ratio_f17_a85],
    ["1.7 held against 0.85, the replica (run2)", RRT["F17-A85"]]]
    .map(([l, r]) => `<tr><td class="l">${esc(l)}</td><td>${ok(r.k) ? `${r.k} · ${r.k0}` : "–"}</td><td>${rrs(r)}</td><td>${ok(r.p) ? pv(r.p) : ok(r.q_p) ? `heterogeneity ${pv(r.q_p)}` : "–"}</td></tr>`).join("");
  const bb = Object.entries(UN.by_bench).map(([b, x]) => `<tr><td class="l">${esc(b)}${b === UN.fresh ? " (the settling run)" : ""}</td><td>${x.F20 ?? "–"}</td><td>${x.A85 ?? "–"}</td><td>${x.F17 ?? "–"}</td></tr>`).join("");
  const tim = [["unity", "F20"], ["unity", "A85"], ["unity", "F17"], ["replica", "F20"], ["replica", "A85"], ["replica", "F17"]].map(([s, c]) => { const x = TM[s][c];
    return x ? `<tr><td class="l">${s === "unity" ? "Unity" : "Replica"} · ${esc(nm(c))}</td><td>${x.n}</td><td>${x.first10}</td><td>${x.early}</td><td>${x.late}</td><td>${f(x.median, 0)}</td></tr>` : ""; }).join("");
  const r1 = ["F20", "A95", "A90", "A85", "F19", "F18", "F17", "F14", "L85", "L95", "F12", "F26", "H85"].filter(c => R1[c]).map(c => { const r = R1[c];
    return `<tr><td class="l">${esc(nm(c))}</td><td>${f(STREET[c], 2)}</td><td>${f(r.st_vprog, 2)}</td><td>${f(r.st_vcoh, 2)}</td><td>${r.events}</td><td>${f(per100(r), 1)}</td><td>${f(r.contact_km, 2)}</td><td>${pc0(r.wrap)}</td><td>${f(r.cov, 0)}°</td></tr>`; }).join("");
  const pwr = (PW.rows || []).map(p => `<tr><td class="l">×${f(p.R, 1)}</td><td>${p.routes.toLocaleString("en")}</td><td>${f(p.km, 0)}</td><td>${pc0(p.detect)}</td><td>${pc0(p.exclude)}</td><td>${f(p.routes * 2 * PW.min_per_flight / 60, 1)}</td></tr>`).join("");
  el.innerHTML = `<div class="intro"><h2>All results</h2><p>Every number on the page, computed from the per-flight records by <code>citysim/swarmspread_review.py</code> (built ${esc(D.built)}).
      The replica is S6's model of Unity on these prism buildings; Unity is the headless bench in BlockShapedPatchCityWorld as baked, with the replica's twin of each flight beside it.</p></div>
    ${tbl("The replica's follow-up run (run2): 1,100 flights a row, the same routes for every row", ["", "spread in the streets", "progress (m/s)", "one group", "cohesive (m/s)", "loss events", "per 100 km (95%)", "vs 2.0 held", "flights with losses", "contacts /km", `pair within ${f(D.near_m, 2)} m`, "on the hull", "surrounded", "bearing covered", "events by city 1 · 2 · 3 · 4"], rep,
      `Speeds and one group over the ${RF.street.toLocaleString("en")} street routes a row; surrounded and bearing covered over the ${RF.cross} straight lines; everything else over every flight. City 1 is the scene's.`)}
    ${tbl("The replica: street speed route by route", ["", "routes", "progress speed (95%)", "faster on", "one group (points)", "cohesive speed (95%)", "faster on"], pairs,
      "Paired differences over the same street routes, as a share of the second setting's mean.")}
    ${tbl("Unity: the street routes of all three benches", ["", "routes", "km", "loss events (collisions · flips)", "per 100 km (95%)", "flights with losses", "contacts /km", "progress (m/s)", "one group", "cohesive (m/s)", `pair within ${f(D.near_m, 2)} m`, "closest pair, median (m)", "pair-ticks within 2 m", "on the hull", "split", "look gap", "twins: flights with losses (both)"], uni,
      "A loss event is the drones lost at one moment: a colliding pair, or one drone flipped after hitting a building (Crashed). 1.7 held, 0.90, 0.95 and the dial at 1.4 flew only the first one or two benches. \"Both\": flights where Unity and its twin both lost drones.")}
    ${tbl("Loss ratios: the narrower setting over the wider", ["", "counts", "ratio (95%)", "two-sided"], cmp,
      "Exact intervals on the ratio of two counts (Clopper-Pearson on one given their sum), with equal exposure where the routes are the same. The combination is inverse-variance on the log ratios; its p tests whether the replica and Unity differ.")}
    ${tbl("Unity loss events by bench", ["", "2.0 held", "0.85", "1.7 held"], bb, "The settling rule was written after the first two benches had flown.")}
    ${tbl("When in a flight the losses came (street routes)", ["", "events", "first 10 s", `first ${f(TM.cut, 0)} s`, "after", "median (s)"], tim,
      "Seconds from the end of the 15 s settle. Unity's from each trajectory's alive mask, a pair merged within 0.3 s; the replica's from its loss log.")}
    ${tbl("The first replica run (run1): every row, including the dial's ends", ["", "spread in the streets", "progress (m/s)", "cohesive (m/s)", "loss events", "per 100 km", "contacts /km", "surrounded", "bearing covered"], r1,
      `${f(R1.F20.km, 0)} km a row. Surrounded and bearing covered over the straight lines and blocks.`)}
    ${tbl("Power of a further Unity run: two settings, street routes", ["true ratio", "routes each", "km each", "detects it", "excludes it when there is none", "bench hours"], pwr,
      `Exact (not simulated), at Unity's 2.0-held rate of ${f(PW.rate, 3)} events per km and ${f(1000 * PW.km_route, 0)} m per route. "Detects": two-sided exact test at 0.05. "Excludes": the 95% upper bound falls below the ratio. Hours at the settling run's pace for both settings.`)}`;
};

// ---------------------------------------------------------------- terms
const TERMS = [
  ["The settings", [
    ["d_ref", "The formation's spacing, the pilot's spread dial (×10 m between neighbours, roughly). The trials' dial runs 1.4–2.6; 2.0 is a ring about 31 m across that closes round a typical building."],
    ["Adaptive spread (S7)", "One swarm-wide scale on d_ref: 1 while a building lies on the swarm's track, the street factor otherwise. Low-passed with a 3 s filter, so the formation narrows and widens over several seconds."],
    ["Street factor", "The share of d_ref the adaptive spread holds in the streets: 0.85 in the scene, so the dial's 2.0 becomes 1.7 there. It has no floor: the dial's 1.4 becomes 1.19."],
    ["Held", "The adaptive spread off and d_ref at one value the whole flight."],
    ["Codes", "F20, F18, F17, …: d_ref held at 2.0, 1.8, 1.7 (F20 is S8's C35). A85, A90, A95: d_ref 2.0 with the adaptive spread at 0.85, 0.90, 0.95 (A85 is the scene, S8's C35a). L85, L95: the dial at 1.4 with 0.85 or 0.95. H85: the dial at 2.6 with 0.85."],
    ["The law under them", "Every row flies the scene's force law: each building avoided as the smallest circle round its footprint (S8), the slide round buildings (S7), d_obs 0.35, route stragglers off."]]],
  ["The measures", [
    ["Progress speed", "The route's length over the time taken to fly it. What a shorter or longer flight means."],
    ["One group", "The share of the flight the drones were one group: each linked to the rest by a free-space path of at most 30 m round the buildings."],
    ["Cohesive speed", "Progress speed times the one-group share: S6's headline, and the speed S9 reports. It rises when the swarm is quicker or when it splits less."],
    ["Loss event", "A moment drones are lost: nearly always two drones closer than 0.5 m (both lost), sometimes a drone flipped after hitting a building. Counted as events, because a pair is one collision."],
    ["Near miss, close-pair time", `A flight whose closest pair came within ${f(D.near_m, 2)} m; the number of physics ticks any pair spent within 2 m. Unity records both on every flight, so they have many more events than the losses.`],
    ["Contact", "A drone touching a facade. In the simulation it does not cost the drone."],
    ["Surrounded, bearing covered", "Of the buildings a straight line aims at, the share whose centre was inside the drones' convex hull at some moment near it; and how much of the 360° round it the drones' bearings covered."],
    ["On the hull", "The share of live drones on the formation's convex hull: the drones whose feeds the pilot's ring shows."]]],
  ["The statistics", [
    ["Exact interval", "Losses are rare, so each count or ratio of counts gets an exact 95% interval rather than one from a normal approximation."],
    ["Route by route", "Every setting flew the same routes, so speeds are compared on each route and the differences averaged."],
    ["Heterogeneity", "A test of whether the replica's ratio and Unity's differ by more than chance. p = 0.09 here: they may, but the data do not show it."],
    ["Fixed-effect combination", "The two log ratios averaged, each weighted by how precisely it is known. Only meaningful if both measure the same thing."],
    ["Power", "The chance a run of a given size detects a true effect, or excludes one that is not there."]]],
  ["The flights", [
    ["Along the streets", "The shortest street route between two junctions 250–420 m apart, junction by junction, at full stick."],
    ["A straight line", "From one junction to another at full stick, through whatever buildings lie between: the formation meets building after building."],
    ["The replica, its twin", "The 2-D model of the swarm the studies use. A twin is the replica flying a Unity flight again from Unity's own start, on the same route."],
    ["The benches", "Three Unity runs: the first (56 flights a setting, six settings), the follow-up (100 street routes, three settings) and the settling run (300 street routes, 2.0 held and 0.85), whose rule was written before it flew."]]]];
RENDER.terms = el => {
  el.innerHTML = `<div class="intro"><h2>Terms</h2><p>Every term the page uses, in plain words. S9's manual (docs/swarm_spread/README.md) has the method.</p></div>
    <div class="terms">${TERMS.map(([h, items]) => `<div class="box"><h3>${esc(h)}</h3><dl>${items.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl></div>`).join("")}</div>`;
};

$("#answer-box").innerHTML = ANSWER_BOX();
if (!route(location.hash.slice(1))) {
  let first = "answer";
  try { const s = localStorage.getItem("s9rtab"); if (TABS.some(t => t[0] === s)) first = s; } catch (e) { /* storage blocked */ }
  show(first);
}
</script>
