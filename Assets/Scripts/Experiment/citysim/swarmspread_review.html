<title>S9 Street Spread Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* The study pages' family: S4's page's styles, inlined at build (swarmspread_review via swarmtune_report.s4_style),
   then this page's additions. The settings keep S9's colours: 2.0 held the neutral, the scene green, 1.7 held blue,
   the other adaptive rows purple; 1.8 held takes the family's one remaining slot. */
/*__S4_STYLE__*/
:root { --k-f20: var(--m-other); --k-a85: var(--c-pass); --k-a90: var(--c-hop); --k-a95: var(--c-hop2);
        --k-f17: var(--c-street); --k-f18: var(--c-hold); --k-l85: var(--c-look); --k-adapt: var(--c-hop2);
        --k-fixed: var(--m-firm); --k-other: var(--m-firm); }
table.dt td.l, table.dt th.l { text-align: left; white-space: normal; min-width: 150px; font-family: var(--font-body); }
table.dt tr.grp td { font-weight: 600; color: var(--ink); background: var(--chip); }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.pair > div { min-width: 0; }
.pair h4 { font: 600 0.82rem/1.3 var(--font-body); color: var(--ink); margin: 0 0 4px; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.seg { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 0.8rem/1 var(--font-body); padding: 6px 10px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--c-hop2) 18%, transparent); color: var(--ink); font-weight: 600; }
.keyrow { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--ink-2); margin: 2px 0 10px; }
.keyrow span { display: inline-flex; align-items: center; gap: 6px; }
.keyrow span.sw::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--sw); }
.chart .keyrow svg { display: inline-block; width: 16px; height: 16px; flex: none; }
svg .ref { stroke: var(--ink-2); stroke-width: 1.2; }
svg .ref2 { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
svg .gridl { stroke: var(--grid); stroke-width: 1; }
svg .ival { stroke: var(--ink); stroke-width: 1.6; }
svg text.note { font: 500 10.5px var(--font-body); fill: var(--muted); }
.qbody.one { grid-template-columns: minmax(0, 1fr); }
.qbody.one .qtext { max-width: 100ch; }
.claims td.v { white-space: nowrap; }
.claims .vp { margin: 0; }
.plan { counter-reset: n; display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.plan > li { display: grid; grid-template-columns: 1.9rem 1fr; gap: 10px; align-items: start; }
.plan > li::before { counter-increment: n; content: counter(n); font: 600 0.9rem/1.9rem var(--font-display); text-align: center; border-radius: 50%; background: var(--chip); color: var(--ink); height: 1.9rem; }
.plan > li > div { min-width: 0; }
.plan p { margin: 2px 0 0; }
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <a class="back" href="https://claude.ai/artifact/8FbWjQ3bF7C65khZYJ3aN5" target="_blank" rel="noopener">← Swarm Study Index</a>

      <p class="lead" id="lead2"></p>
    </div>

  <main id="main"></main>
</div>

<!--__RV_INLINE__-->
<script>/*__REPLAY_VIEW__*/</script>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
try { const el = document.getElementById("rv-inline"); if (el) window.RV_INLINE = JSON.parse(el.textContent); } catch (e) { /* none */ }
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ok = x => x !== null && x !== undefined && !Number.isNaN(x);
const f = (x, nd = 2) => ok(x) ? Number(x).toFixed(nd) : "–";
const pct = (x, nd = 1) => ok(x) ? `${(100 * x).toFixed(nd)}%` : "–";
const pc0 = x => ok(x) ? `${Math.round(100 * x)}%` : "–";
const pv = p => !ok(p) ? "–" : p < 0.001 ? "p &lt; 0.001" : `p = ${p < 0.01 ? p.toFixed(3) : p.toFixed(2)}`;
const rr = r => r && ok(r.ratio) ? `×${f(r.ratio)} (95%: ${f(r.lo)}–${ok(r.hi) ? f(r.hi) : "∞"})` : "–";
const rrs = r => r && ok(r.ratio) ? `×${f(r.ratio)} (${f(r.lo)}–${ok(r.hi) ? f(r.hi) : "∞"})` : "–";
const fewer = x => ok(x) ? `${Math.round(100 * (1 - x))}%` : "–";

// ---------------------------------------------------------------- the data
const RP = D.replica.rows, RPP = D.replica.paired, RRT = D.replica.ratios, R1 = D.replica.rows1, RF = D.replica.flights;
const UN = D.unity, UR = UN.rows, UP = UN.paired, UF = UN.paired_f17, UFF = UN.paired_f17_f20;
const TM = D.timing, CB = D.combined, TO = D.twin_own, PW = D.power, PHS = D.phases;
const NAME = {F20: "2.0 held", A95: "adaptive 0.95", A90: "adaptive 0.90", A85: "adaptive 0.85 (the scene)", F19: "1.9 held",
              F18: "1.8 held", F17: "1.7 held", F14: "1.4 held", L85: "dial 1.4, adaptive 0.85", L95: "dial 1.4, adaptive 0.95",
              F12: "1.2 held", F26: "2.6 held", H85: "dial 2.6, adaptive 0.85"};
const STREET = {F20: 2.0, A95: 1.9, A90: 1.8, A85: 1.7, F19: 1.9, F18: 1.8, F17: 1.7, F14: 1.4, L85: 1.19, L95: 1.33, F12: 1.2, F26: 2.6, H85: 2.21};
const nm = c => NAME[c] || c;
const COL = c => c === "A85" ? "var(--k-a85)" : c === "F17" ? "var(--k-f17)" : c === "F20" ? "var(--k-f20)" : c === "F18" ? "var(--k-f18)"
  : /^[AHL]/.test(c) ? "var(--k-adapt)" : "var(--k-fixed)";
const per100 = r => r && r.km ? 100 * r.events / r.km : null;
const ci100 = r => r && r.km && r.ci ? [100 * r.ci[0] / r.km, 100 * r.ci[1] / r.km] : null;
const dial = ["F14", "L85", "L95", "F12"].map(c => R1[c]).filter(Boolean);
const DIAL = {events: dial.reduce((s, r) => s + r.events, 0), km: dial.reduce((s, r) => s + r.km, 0),
              wrapLo: Math.min(...dial.map(r => r.wrap)), wrapHi: Math.max(...dial.map(r => r.wrap))};
const F20U = UR.F20, A85U = UR.A85, F17U = UR.F17;
const kmPerEvent = F20U.km / F20U.events;
const pw = (R, n) => (PW.rows || []).find(x => x.R === R && x.routes === n);
const share = (a, b) => ok(a) && ok(b) && a ? (a - b) / a : null;   // the part of a that is not b

// ---------------------------------------------------------------- tooltip and chart helpers (S5's)
const TIP = document.createElement("div");
TIP.className = "tip"; TIP.hidden = true; TIP.setAttribute("role", "status");
document.body.appendChild(TIP);
function tipShow(x, y, title, rows) {
  TIP.replaceChildren();
  const t = document.createElement("div"); t.className = "t"; t.textContent = title; TIP.appendChild(t);
  for (const [col, val, lab] of rows) {
    const r = document.createElement("div"); r.className = "tr";
    const k = document.createElement("span"); k.className = "k"; k.style.borderColor = col;
    const b = document.createElement("b"); b.textContent = val;
    const l = document.createElement("span"); l.textContent = lab;
    r.append(k, b, l); TIP.appendChild(r);
  }
  TIP.hidden = false;
  const pad = 14, w = TIP.offsetWidth, h = TIP.offsetHeight;
  let px = x + pad, py = y + pad;
  if (px + w > innerWidth - 8) px = x - w - pad;
  if (py + h > innerHeight - 8) py = y - h - pad;
  TIP.style.left = Math.max(8, px) + "px"; TIP.style.top = Math.max(8, py) + "px";
}
function tipHide() { TIP.hidden = true; }
function hoverMarks(root, rowsFor) {
  root.querySelectorAll("[data-i]").forEach(m => {
    const i = +m.dataset.i;
    m.addEventListener("pointermove", ev => { const [t, rows] = rowsFor(i); tipShow(ev.clientX, ev.clientY, t, rows); });
    m.addEventListener("pointerleave", tipHide);
    m.addEventListener("focus", () => { const b = m.getBoundingClientRect(), [t, rows] = rowsFor(i); tipShow(b.right, b.top, t, rows); });
    m.addEventListener("blur", tipHide);
  });
}
const cw = (el, lo = 260, hi = 760) => Math.max(lo, Math.min(hi, Math.round(el.clientWidth || 640)));
function observe(el, draw) {
  let w = 0;
  new ResizeObserver(() => { const n = Math.round(el.clientWidth); if (n && Math.abs(n - w) > 24) { w = n; requestAnimationFrame(draw); } }).observe(el);
}
const svgOf = (W, H, label, g) => `<svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${esc(label)}">${g}</svg>`;
const swatches = cs => `<div class="keyrow">${cs.map(c => `<span class="sw" style="--sw:${COL(c)}">${esc(nm(c))}</span>`).join("")}</div>`;
const SHORTL = {F20: "2.0 held", A85: "0.85 (the scene)", F17: "1.7 held"};

// Small-multiple horizontal bars from zero: one panel per measure, one bar per row; an optional interval per bar.
function barPanels(el, rows, panels, legend) {
  const W = Math.max(220, Math.min(380, Math.floor(cw(el) / Math.min(panels.length, Math.max(1, Math.floor(cw(el) / 230)))) - 12));
  const bh = 16, gap = 7, m = {l: 122, r: 60, t: 4, b: 6}, H = m.t + rows.length * (bh + gap) - gap + m.b;
  const panel = (p, pi) => {
    const vals = rows.map(x => p.get(x.r)), iv = rows.map(x => p.ci ? p.ci(x.r) : null);
    const vmax = Math.max(1e-9, ...vals.filter(ok), ...iv.filter(Boolean).map(v => v[1])) * 1.05;
    const xx = v => m.l + (W - m.l - m.r) * Math.max(0, v) / vmax;
    let g = `<line class="gridl" x1="${m.l}" x2="${m.l}" y1="0" y2="${H}"/>`;
    rows.forEach((x, i) => {
      const v = vals[i], yy = m.t + i * (bh + gap);
      g += `<text class="lbl" x="${m.l - 8}" y="${yy + bh / 2 + 4}" text-anchor="end">${esc(x.lab || nm(x.c))}</text>`;
      if (ok(v)) {
        g += `<rect x="${m.l}" y="${yy}" width="${Math.max(1.5, xx(v) - m.l).toFixed(1)}" height="${bh}" rx="2" fill="${COL(x.c)}"/>`;
        const ci = iv[i];
        if (ci) g += `<line class="ival" x1="${xx(ci[0]).toFixed(1)}" x2="${xx(ci[1]).toFixed(1)}" y1="${yy + bh / 2}" y2="${yy + bh / 2}"/>
          <line class="ival" x1="${xx(ci[1]).toFixed(1)}" x2="${xx(ci[1]).toFixed(1)}" y1="${yy + 4}" y2="${yy + bh - 4}"/>`;
        g += `<text class="val" x="${(xx(ci ? Math.max(v, ci[1]) : v) + 5).toFixed(1)}" y="${yy + bh - 3}">${p.f(v)}</text>`;
      } else g += `<text class="val" x="${m.l + 4}" y="${yy + bh - 3}">–</text>`;
      g += `<rect class="hit" data-i="${pi * 100 + i}" tabindex="0" x="0" y="${yy}" width="${W}" height="${bh}"/>`;
    });
    return `<div><h4>${esc(p.title)}</h4>${svgOf(W, H, p.title, g)}${p.unit ? `<p class="small muted">${esc(p.unit)}</p>` : ""}</div>`;
  };
  el.innerHTML = `${legend || ""}<div class="pair">${panels.map(panel).join("")}</div>`;
  hoverMarks(el, k => { const p = panels[Math.floor(k / 100)], x = rows[k % 100], ci = p.ci ? p.ci(x.r) : null;
    return [x.tip || x.lab || nm(x.c), [[COL(x.c), p.f(p.get(x.r)) + (ci ? ` (95%: ${p.f(ci[0])} to ${p.f(ci[1])})` : ""), p.title]]]; });
}

// Rate ratios against 2.0 held on a log axis, each with its exact 95% interval. Shape says where the number comes from.
const SHAPE = {
  replica: (x, y, c) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${c}" stroke="var(--panel)" stroke-width="2"/>`,
  unity: (x, y, c) => `<rect x="${x - 5.5}" y="${y - 5.5}" width="11" height="11" rx="1.5" fill="${c}" stroke="var(--panel)" stroke-width="2"/>`,
  both: (x, y, c) => `<path d="M${x} ${y - 7}L${x + 7} ${y}L${x} ${y + 7}L${x - 7} ${y}Z" fill="${c}" stroke="var(--panel)" stroke-width="2"/>`};
const shapeKey = () => `<div class="keyrow">${[["replica", "the replica's own flights"], ["unity", "Unity (or its replica twins, where named)"], ["both", "the two combined"]]
  .map(([k, l]) => `<span class="sh"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${SHAPE[k](8, 8, "var(--ink-2)")}</svg>${esc(l)}</span>`).join("")}</div>`;
function forest(el, rows) {
  const W = cw(el, 300, 760), narrow = W < 560;
  const m = {l: narrow ? 128 : 238, r: narrow ? 96 : 124, t: 26, b: 30}, rh = 25;
  const H = m.t + rows.length * rh + m.b, L0 = Math.log(0.25), L1 = Math.log(4);
  const xx = v => m.l + (W - m.l - m.r) * (Math.log(Math.min(4, Math.max(0.25, v))) - L0) / (L1 - L0);
  let g = "";
  for (const t of [0.25, 0.5, 1, 2, 4]) g += `<line class="gridl" x1="${xx(t)}" x2="${xx(t)}" y1="${m.t - 4}" y2="${H - m.b + 4}"/><text class="lbl" x="${xx(t)}" y="${H - m.b + 18}" text-anchor="middle">×${t}</text>`;
  g += `<line class="ref" x1="${xx(1)}" x2="${xx(1)}" y1="${m.t - 4}" y2="${H - m.b + 4}"/><line class="ref2" x1="${xx(2)}" x2="${xx(2)}" y1="${m.t - 4}" y2="${H - m.b + 4}"/>`;
  g += `<text class="note" x="${xx(1) - 4}" y="${m.t - 10}" text-anchor="end">no change</text><text class="note" x="${xx(2) + 4}" y="${m.t - 10}">the replica's doubling</text>`;
  rows.forEach((x, i) => {
    const y = m.t + i * rh + rh / 2, r = x.r, c = COL(x.c);
    g += `<text class="lbl" x="${m.l - 10}" y="${y + 4}" text-anchor="end">${esc(narrow ? x.short : x.lab)}</text>`;
    if (r && ok(r.ratio)) {
      const hi = ok(r.hi) ? r.hi : 4;
      g += `<line class="ival" x1="${xx(r.lo).toFixed(1)}" x2="${xx(hi).toFixed(1)}" y1="${y}" y2="${y}"/>`;
      g += SHAPE[x.src](+xx(r.ratio).toFixed(1), y, c);
      g += `<text class="val" x="${W - m.r + 10}" y="${y + 4}">${esc(rrs(r))}</text>`;
    }
    g += `<rect class="hit" data-i="${i}" tabindex="0" x="0" y="${y - rh / 2}" width="${W}" height="${rh}"/>`;
  });
  el.innerHTML = `${shapeKey()}${svgOf(W, H, "Loss-event ratios against 2.0 held", g)}`;
  hoverMarks(el, i => { const x = rows[i], r = x.r;
    return [x.lab, [[COL(x.c), rr(r), x.what || "loss events, the narrower setting over 2.0 held"], ...(r && ok(r.k) ? [[COL(x.c), `${r.k} against ${r.k0}`, "the two counts"]] : [])]]; });
}

// ---------------------------------------------------------------- the masthead
$("#lead1").innerHTML = `The trials have pilots search BlockShapedPatchCityWorld with a swarm of ten drones or with one drone. Since S8 the scene flies S7's
  <b>adaptive spread</b> at 0.85: the pilot's d_ref 2.0 narrowed to 1.7 in the streets and widened back when the swarm flies at a building. S9 asked whether
  it narrows too much, and concluded after the replica and three Unity benches that it flies the streets 8% faster, touches buildings 39% less and costs no drones.`;
$("#lead2").innerHTML = `This page reads the same flights again from the per-flight records (${(RF.n + RF.n1).toLocaleString("en")} replica flights and
  ${A85U.n + F20U.n + F17U.n + UR.A90.n + UR.A95.n + UR.L85.n} Unity street flights, each with its replica twin) without the study's own summaries, and checks each
  of those claims. Nothing was flown again. <a href="${esc(D.original)}" target="_blank" rel="noopener">S9's own page</a> has the method and every run.`;

function ANSWER_BOX() {
  return `<p class="eyebrow">The short answer</p><ol>
    <li><b>Narrower in the streets is quicker, by about 3%.</b> Progress speed is up ${pct(UP.vprog.pct)} in Unity (${pct(RPP["A85-F20"].vprog.pct)} in the replica), on ${pc0(UP.vprog.higher)} of routes.
      S9's 8% is cohesive speed, which also counts the swarm staying one group ${f(100 * UP.one, 0)} points more of the time.</li>
    <li><b>It touches buildings less and splits less.</b> In Unity it has ${fewer(UP.contacts.ratio)} fewer building contacts (95%: ${fewer(UP.contacts.hi)}–${fewer(UP.contacts.lo)}), and the swarm is split ${pc0(A85U.split)} of the time against ${pc0(F20U.split)}.</li>
    <li><b>Whether it costs drones is open.</b> Unity: ${rrs(UN.ratio)}. The replica's own flights: ${rrs(RRT.A85)}. The two do not differ significantly
      (p = ${f(CB.q_p, 2)}), and Unity's own near-miss measures lean the replica's way. "Costs no drones" is more than ${F20U.n} routes can show.</li>
    <li><b>It has not beaten holding 1.7.</b> 1.7 held loses no more (replica ${RP.F17.events} against ${RP.A85.events}, Unity ${F17U.events} against ${UN.ratio_f17_a85.k0}),
      is ${pct(RPP["F17-A85"].vprog.pct)} quicker again and surrounds as many buildings.</li></ol>
    <p class="bottom"><b>My reading:</b> keep the scene's setting for the trials. Its gains are real, and no alternative has been shown to be better.
      What is not established is that it helps more than holding 1.7, or that it is safe to within ×1.5. One overnight Unity run would settle both. <a href="#q7">What to fly</a>.</p>`;
}

// ---------------------------------------------------------------- tabs
const TABS = [["answer", "The answer"], ["flights", "Cities and flights"], ["details", "All results"], ["terms", "Terms"]];
const RENDER = {}, KEEP = {};
let CURRENT = null, PLAYER = null;
function show(id, anchor) {
  for (const b of document.querySelectorAll(".tab-btn")) b.setAttribute("aria-selected", b.dataset.id === id);
  if (CURRENT === "flights" && PLAYER && id !== "flights") PLAYER.hide();
  const mm = $("#main");
  mm.replaceChildren();
  let sec = KEEP[id];
  if (sec) { mm.appendChild(sec); if (id === "flights" && PLAYER) PLAYER.show(); }
  else {
    sec = document.createElement("section");
    sec.className = "tab"; sec.id = `tab-${id}`; sec.setAttribute("role", "tabpanel");
    mm.appendChild(sec);
    RENDER[id](sec);
    if (id === "flights") KEEP[id] = sec;
  }
  CURRENT = id;
  try { localStorage.setItem("s9rtab", id); } catch (e) { /* private window */ }
  const target = anchor && document.getElementById(anchor);
  if (target) requestAnimationFrame(() => target.scrollIntoView({block: "start"}));
}
$("#tabs").innerHTML = TABS.map(([id, label]) => `<button class="tab-btn" role="tab" data-id="${id}" aria-selected="false">${label}</button>`).join("");
for (const b of document.querySelectorAll(".tab-btn")) b.addEventListener("click", () => show(b.dataset.id));
function route(h) {
  if (h === "reading" || h === "claims" || /^q\d$/.test(h)) { show("answer", h); return true; }
  if (h.startsWith("watch:")) {
    const [, gid, cond] = h.split(":");
    show("flights");
    const gi = PLAYER && D.replay ? D.replay.groups.findIndex(g => g.id === gid) : -1;
    if (gi >= 0) { const keep = cond ? D.replay.groups[gi].flights.find(fl => fl.cond === cond && fl.source === "unity") : null; PLAYER.selectGroup(gi, keep || undefined); }
    return true;
  }
  if (TABS.some(t => t[0] === h)) { show(h); return true; }
  return false;
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  const h = a.getAttribute("href").slice(1);
  if (route(h)) { e.preventDefault(); if (TABS.some(t => t[0] === h)) $("#tabs").scrollIntoView({block: "start"}); }
});
const watch = (gid, cond, text) => D.replay && D.replay.groups.some(g => g.id === gid) ? `<a class="watch" href="#watch:${gid}:${cond}">${esc(text)}</a>` : "";
const pill = (cls, text) => `<span class="vp ${cls}">${esc(text)}</span>`;

// ---------------------------------------------------------------- the answer
function claimsTable() {
  const T = TM, uf = UN.ratio_fresh, ue = UN.ratio_earlier, cl = [
    ["“Narrower is faster: 8% in the streets.”",
     `Progress speed +${pct(UP.vprog.pct)} in Unity, +${pct(RPP["A85-F20"].vprog.pct)} in the replica. About ${pc0(share(RPP["A85-F20"].vcoh.pct, RPP["A85-F20"].vprog.pct))} of the 8% is the one-group share, which is a gain in cohesion, not speed.`,
     ["part", "Overstated"]],
    ["“In Unity the narrower street spread costs no drones.”",
     `${rr(UN.ratio)}. A rise of 50% fits the data as well as no rise does, and Unity's close calls are more frequent at 0.85.`,
     ["part", "Overstated"]],
    ["“The settling run rules out the replica's doubling.”",
     `Only with the two benches seen before its rule was written (${ue.k} against ${ue.k0}). The fresh bench alone is ${uf.k} against ${uf.k0}, ${rr(uf)}, which does not exclude a doubling.`,
     ["part", "Weaker than stated"]],
    ["“The doubling lies in the replica's own flights, not the law; the start is the likely difference.”",

        <dl class="kv" id="c-stats"></dl></div></div>
    <div class="intro" id="flightsx"><h2>Flights</h2><p>Routes from the first Unity bench's set in the scene's city, each flown the six ways that bench flew them: d_ref 2.0 held, the adaptive
      spread narrowing to 0.85, 0.90 and 0.95 of it, d_ref 1.7 held, and the dial at its lowest (1.4) with the adaptive spread. Unity's own
      trajectories, and the replica's twins flown from Unity's recorded start. Drones are dots in the setting's colour,
      filled while their feed is on the pilot's ring; a ring round a dot marks a drone apart from the main group; a cross marks a drone lost. Space plays or pauses, ← and → step 5 s.
      A few flights cannot show a difference that takes hundreds to measure (<a href="#q2">question 2</a>).</p></div><div id="c-player"></div>`;
  const gal = $("#gal", el), thumbs = [];
  gal.innerHTML = RPL.gallery.map((g, i) => `<button type="button" class="thumb" data-i="${i}" aria-pressed="${i === 0}"><div class="figframe"><canvas aria-hidden="true"></canvas></div><span>${esc(g.seed === 1 ? "the scene's city" : `held out, seed ${g.seed}`)}</span></button>`).join("");
  const CM = new RV.MapView($("#c-map", el), {aspect: 0.8, minH: 320, maxH: 760});
  let city = null, sel = 0, suf = "__enc";
  CM.draw = (c, v) => { if (city) { RV.drawCity(c, v, city, {cylinders: true}); RV.drawScale(c, v); } };
  el.querySelectorAll(".mapbar button").forEach(b => b.addEventListener("click", () => { if (b.dataset.z === "in") CM.zoomBy(1.5); else if (b.dataset.z === "out") CM.zoomBy(1 / 1.5); else if (city) CM.fit(city.arena, 10); }));
  const load = keepView => {
    const g = RPL.gallery[sel], st = (g.stats || {})[suf || "bounds"] || {}, i = sel;
    $("#c-title").textContent = g.what.charAt(0).toUpperCase() + g.what.slice(1);
    $("#c-stats").innerHTML = [["buildings", st.buildings], ["circle radius (median)", suf === "__fp" ? "–" : `${f(st.cyl_r, 1)} m`],
      ["street left between two buildings (median)", `${f(st.gap_median, 1)} m`], ["streets closed", st.pairs ? `${st.closed} of ${st.pairs}` : "–"], ["… narrowed below 6 m", st.narrow]]
      .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v === undefined ? "–" : v}</dd>`).join("");
    RV.load(RPATH.city(g.city + suf)).then(RV.city).then(C => { if (sel !== i) return; city = C; if (keepView) CM.request(); else CM.fit(C.arena, 10); });
  };
  el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    suf = b.dataset.s; el.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); load(true);
  }));
  const pick = i => { sel = i; gal.querySelectorAll(".thumb").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.i === i))); load(false); };
  gal.querySelectorAll(".thumb").forEach(b => {
    const v = new RV.MapView(b.querySelector("canvas"), {aspect: 1, minH: 40, maxH: 400, minW: 40, interactive: false});
    v.draw = (c, vv) => { if (vv.city) RV.drawCity(c, vv, vv.city, {}); };
    thumbs.push(v);
    RV.load(RPATH.city(RPL.gallery[+b.dataset.i].city)).then(RV.city).then(C => { v.city = C; v.fit([-150, 150, -150, 150], 0); }).catch(() => {});
    b.addEventListener("click", () => pick(+b.dataset.i));
  });
  RV.onTheme(() => { thumbs.forEach(v => v.request()); CM.request(); });
  pick(0);
  const labels = {}, colors = {};
  for (const [k, l] of WAYS) { labels[k] = l; colors[k] = `var(--k-${k})`; }
  PLAYER = RV.Player($("#c-player", el), RPL.groups.map(g => Object.assign({short: g.title.replace(/^Problem: /, "Problem · ")}, g)),
    {labels, colors, path: RPATH, summaryRows: flightSummaryRows, summaryNote: flightSummaryNote});
  PLAYER.start(0);
};
function flightSummaryRows(F, s) {
  const n = x => ok(x) ? String(x) : "–", r = [];
  r.push(["d_ref (the dial)", f(s.d, 1)], ["adaptive spread", s.adaptive ? `on, ${f(s.street_factor, 2)} in the streets (${f(s.d * s.street_factor, 2)})` : "off"]);
  const k = F.route ? F.route.kind : "";
  r.push(["route", F.route ? `${k === "cross" ? "a straight line" : k === "pass" ? "through a block" : "along the streets"}, ${f(F.route.L, 0)} m` : "–"]);
  r.push(["progress speed", `${f(s.v_prog, 2)} m/s`], ["flight as one group", pc0(s.one_frac)], ["cohesive speed", `${f(s.v_coh, 2)} m/s`], ["ended in pieces", s.open_end ? "yes" : "no"]);
  if (s.met) r.push(["buildings met / surrounded", `${s.met} / ${n(s.wrapped)}`], ["seconds past each, on average", f(s.bld_pass, 1)]);
  r.push(["closest pair (m)", f(s.min_pair, 2)], ["drones lost", n(s.lost)], ["building contacts", n(s.contacts)]);
  return r;
}
function flightSummaryNote(F) {
  return F.source === "unity" ? "Unity records contacts as a count, so they are not drawn on the map; a cross marks each drone lost."
    : "The replica draws each building contact where it happened and a cross where each drone was lost.";
}

// ---------------------------------------------------------------- all results
RENDER.details = el => {
  const tbl = (title, head, body, note = "") => `<div class="box"><h3>${esc(title)}</h3><div class="tablewrap"><table class="dt"><thead><tr>${head.map((h, i) => `<th${i === 0 ? ' class="l"' : ""}>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>${note ? `<p class="small muted">${note}</p>` : ""}</div>`;
  const rep = ["F20", "A95", "A90", "A85", "F18", "F17"].map(c => { const r = RP[c], ci = ci100(r);
    return `<tr><td class="l">${esc(nm(c))}</td><td>${f(STREET[c], 2)}</td><td>${f(r.st_vprog, 2)}</td><td>${pc0(r.st_one)}</td><td>${f(r.st_vcoh, 2)}</td><td>${r.events}</td><td>${f(per100(r), 1)} (${f(ci[0], 1)}–${f(ci[1], 1)})</td>
      <td>${c === "F20" ? "–" : rrs(RRT[c])}</td><td>${r.flights_lost}</td><td>${f(r.contact_km, 2)}</td><td>${pct(r.near)}</td><td>${pc0(r.hull)}</td><td>${pct(r.wrap)}</td><td>${f(r.cov, 0)}°</td>
      <td>${["1", "2", "3", "4"].map(s => r.by_seed[s] ?? "–").join(" · ")}</td></tr>`; }).join("");
  const pairs = ["A95-F20", "A90-F20", "A85-F20", "F18-F20", "F17-F20", "F17-A85", "F18-A85"].map(k => { const p = RPP[k], [a, b] = k.split("-");
    return `<tr><td class="l">${esc(nm(a))} against ${esc(nm(b))}</td><td>${p.vprog.n}</td><td>${pct(p.vprog.pct)} (${pct(p.vprog.lo)} to ${pct(p.vprog.hi)})</td><td>${pc0(p.vprog.higher)}</td>
      <td>${f(100 * p.one, 1)}</td><td>${pct(p.vcoh.pct)} (${pct(p.vcoh.lo)} to ${pct(p.vcoh.hi)})</td><td>${pc0(p.vcoh.higher)}</td></tr>`; }).join("");
  const uni = ["F20", "A95", "A90", "A85", "F17", "L85"].filter(c => UR[c]).map(c => { const r = UR[c], ci = ci100(r);
    return `<tr><td class="l">${esc(nm(c))}</td><td>${r.n}</td><td>${f(r.km, 0)}</td><td>${r.events} (${r.coll} · ${r.crashed})</td><td>${f(per100(r), 1)} (${f(ci[0], 1)}–${f(ci[1], 1)})</td><td>${r.flights_lost}</td>
      <td>${f(r.contact_km, 2)}</td><td>${f(r.vprog, 2)}</td><td>${pc0(r.one)}</td><td>${f(r.vcoh, 2)}</td><td>${pct(r.near)}</td><td>${f(r.min_pair, 2)}</td><td>${f(r.near_ticks, 0)}</td>
      <td>${pc0(r.hull)}</td><td>${pc0(r.split)}</td><td>${f(r.look, 1)}°</td><td>${r.twin_flights_lost} (${r.both_lost})</td></tr>`; }).join("");
  const cmp = [["Unity, three benches, loss events", UN.ratio], ["Unity, the fresh bench only (flown after the settling rule)", UN.ratio_fresh],
    ["Unity, the first two benches (seen before the rule)", UN.ratio_earlier], ["Unity, collisions between drones only", UN.ratio_coll],
    ["Unity, flights that lost drones", UN.ratio_flights], [`Unity, loss events after the first ${f(TM.cut, 0)} s`, TM.unity_late],
    ["Unity's replica twins, flights that lost drones", UN.ratio_twin], ["The replica's own flights (run2), loss events", RRT.A85],
    [`The replica's own flights, after the first ${f(TM.cut, 0)} s (street routes)`, TM.replica_late], ["Replica and Unity combined (fixed effect)", CB],
    ["1.7 held against 2.0 held, Unity (two benches)", UN.ratio_f17], ["1.7 held against 0.85, Unity (two benches)", UN.ratio_f17_a85],
    ["1.7 held against 0.85, the replica (run2)", RRT["F17-A85"]]]
    .map(([l, r]) => `<tr><td class="l">${esc(l)}</td><td>${ok(r.k) ? `${r.k} · ${r.k0}` : "–"}</td><td>${rrs(r)}</td><td>${ok(r.p) ? pv(r.p) : ok(r.q_p) ? `heterogeneity ${pv(r.q_p)}` : "–"}</td></tr>`).join("");
  const bb = Object.entries(UN.by_bench).map(([b, x]) => `<tr><td class="l">${esc(b)}${b === UN.fresh ? " (the settling run)" : ""}</td><td>${x.F20 ?? "–"}</td><td>${x.A85 ?? "–"}</td><td>${x.F17 ?? "–"}</td></tr>`).join("");
  const tim = [["unity", "F20"], ["unity", "A85"], ["unity", "F17"], ["replica", "F20"], ["replica", "A85"], ["replica", "F17"]].map(([s, c]) => { const x = TM[s][c];
    return x ? `<tr><td class="l">${s === "unity" ? "Unity" : "Replica"} · ${esc(nm(c))}</td><td>${x.n}</td><td>${x.first10}</td><td>${x.early}</td><td>${x.late}</td><td>${f(x.median, 0)}</td></tr>` : ""; }).join("");
  const r1 = ["F20", "A95", "A90", "A85", "F19", "F18", "F17", "F14", "L85", "L95", "F12", "F26", "H85"].filter(c => R1[c]).map(c => { const r = R1[c];
    return `<tr><td class="l">${esc(nm(c))}</td><td>${f(STREET[c], 2)}</td><td>${f(r.st_vprog, 2)}</td><td>${f(r.st_vcoh, 2)}</td><td>${r.events}</td><td>${f(per100(r), 1)}</td><td>${f(r.contact_km, 2)}</td><td>${pc0(r.wrap)}</td><td>${f(r.cov, 0)}°</td></tr>`; }).join("");
  const pwr = (PW.rows || []).map(p => `<tr><td class="l">×${f(p.R, 1)}</td><td>${p.routes.toLocaleString("en")}</td><td>${f(p.km, 0)}</td><td>${pc0(p.detect)}</td><td>${pc0(p.exclude)}</td><td>${f(p.routes * 2 * PW.min_per_flight / 60, 1)}</td></tr>`).join("");
  el.innerHTML = `<div class="intro"><h2>All results</h2><p>Every number on the page, computed from the per-flight records by <code>citysim/swarmspread_review.py</code> (built ${esc(D.built)}).
      The replica is S6's model of Unity on these prism buildings; Unity is the headless bench in BlockShapedPatchCityWorld as baked, with the replica's twin of each flight beside it.</p></div>
    ${tbl("The replica's follow-up run (run2): 1,100 flights a row, the same routes for every row", ["", "spread in the streets", "progress (m/s)", "one group", "cohesive (m/s)", "loss events", "per 100 km (95%)", "vs 2.0 held", "flights with losses", "contacts /km", `pair within ${f(D.near_m, 2)} m`, "on the hull", "surrounded", "bearing covered", "events by city 1 · 2 · 3 · 4"], rep,
      `Speeds and one group over the ${RF.street.toLocaleString("en")} street routes a row; surrounded and bearing covered over the ${RF.cross} straight lines; everything else over every flight. City 1 is the scene's.`)}
    ${tbl("The replica: street speed route by route", ["", "routes", "progress speed (95%)", "faster on", "one group (points)", "cohesive speed (95%)", "faster on"], pairs,
      "Paired differences over the same street routes, as a share of the second setting's mean.")}
    ${tbl("Unity: the street routes of all three benches", ["", "routes", "km", "loss events (collisions · flips)", "per 100 km (95%)", "flights with losses", "contacts /km", "progress (m/s)", "one group", "cohesive (m/s)", `pair within ${f(D.near_m, 2)} m`, "closest pair, median (m)", "pair-ticks within 2 m", "on the hull", "split", "look gap", "twins: flights with losses (both)"], uni,
      "A loss event is the drones lost at one moment: a colliding pair, or one drone flipped after hitting a building (Crashed). 1.7 held, 0.90, 0.95 and the dial at 1.4 flew only the first one or two benches. \"Both\": flights where Unity and its twin both lost drones.")}
    ${tbl("Loss ratios: the narrower setting over the wider", ["", "counts", "ratio (95%)", "two-sided"], cmp,
      "Exact intervals on the ratio of two counts (Clopper-Pearson on one given their sum), with equal exposure where the routes are the same. The combination is inverse-variance on the log ratios; its p tests whether the replica and Unity differ.")}
    ${tbl("Unity loss events by bench", ["", "2.0 held", "0.85", "1.7 held"], bb, "The settling rule was written after the first two benches had flown.")}
    ${tbl("When in a flight the losses came (street routes)", ["", "events", "first 10 s", `first ${f(TM.cut, 0)} s`, "after", "median (s)"], tim,
      "Seconds from the end of the 15 s settle. Unity's from each trajectory's alive mask, a pair merged within 0.3 s; the replica's from its loss log.")}
    ${tbl("The first replica run (run1): every row, including the dial's ends", ["", "spread in the streets", "progress (m/s)", "cohesive (m/s)", "loss events", "per 100 km", "contacts /km", "surrounded", "bearing covered"], r1,
      `${f(R1.F20.km, 0)} km a row. Surrounded and bearing covered over the straight lines and blocks.`)}
    ${tbl("Power of a further Unity run: two settings, street routes", ["true ratio", "routes each", "km each", "detects it", "excludes it when there is none", "bench hours"], pwr,
      `Exact (not simulated), at Unity's 2.0-held rate of ${f(PW.rate, 3)} events per km and ${f(1000 * PW.km_route, 0)} m per route. "Detects": two-sided exact test at 0.05. "Excludes": the 95% upper bound falls below the ratio. Hours at the settling run's pace for both settings.`)}`;
};

// ---------------------------------------------------------------- terms
const TERMS = [
  ["The settings", [
    ["d_ref", "The formation's spacing, the pilot's spread dial (×10 m between neighbours, roughly). The trials' dial runs 1.4–2.6; 2.0 is a ring about 31 m across that closes round a typical building."],
    ["Adaptive spread (S7)", "One swarm-wide scale on d_ref: 1 while a building lies on the swarm's track, the street factor otherwise. Low-passed with a 3 s filter, so the formation narrows and widens over several seconds."],
    ["Street factor", "The share of d_ref the adaptive spread holds in the streets: 0.85 in the scene, so the dial's 2.0 becomes 1.7 there. It has no floor: the dial's 1.4 becomes 1.19."],
    ["Held", "The adaptive spread off and d_ref at one value the whole flight."],
    ["Codes", "F20, F18, F17, …: d_ref held at 2.0, 1.8, 1.7 (F20 is S8's C35). A85, A90, A95: d_ref 2.0 with the adaptive spread at 0.85, 0.90, 0.95 (A85 is the scene, S8's C35a). L85, L95: the dial at 1.4 with 0.85 or 0.95. H85: the dial at 2.6 with 0.85."],
    ["The law under them", "Every row flies the scene's force law: each building avoided as the smallest circle round its footprint (S8), the slide round buildings (S7), d_obs 0.35, route stragglers off."]]],
  ["The measures", [
    ["Progress speed", "The route's length over the time taken to fly it. What a shorter or longer flight means."],
    ["One group", "The share of the flight the drones were one group: each linked to the rest by a free-space path of at most 30 m round the buildings."],
    ["Cohesive speed", "Progress speed times the one-group share: S6's headline, and the speed S9 reports. It rises when the swarm is quicker or when it splits less."],
    ["Loss event", "A moment drones are lost: nearly always two drones closer than 0.5 m (both lost), sometimes a drone flipped after hitting a building. Counted as events, because a pair is one collision."],
    ["Near miss, close-pair time", `A flight whose closest pair came within ${f(D.near_m, 2)} m; the number of physics ticks any pair spent within 2 m. Unity records both on every flight, so they have many more events than the losses.`],
    ["Contact", "A drone touching a facade. In the simulation it does not cost the drone."],
    ["Surrounded, bearing covered", "Of the buildings a straight line aims at, the share whose centre was inside the drones' convex hull at some moment near it; and how much of the 360° round it the drones' bearings covered."],
    ["On the hull", "The share of live drones on the formation's convex hull: the drones whose feeds the pilot's ring shows."]]],
  ["The statistics", [
    ["Exact interval", "Losses are rare, so each count or ratio of counts gets an exact 95% interval rather than one from a normal approximation."],
    ["Route by route", "Every setting flew the same routes, so speeds are compared on each route and the differences averaged."],
    ["Heterogeneity", "A test of whether the replica's ratio and Unity's differ by more than chance. p = 0.09 here: they may, but the data do not show it."],
    ["Fixed-effect combination", "The two log ratios averaged, each weighted by how precisely it is known. Only meaningful if both measure the same thing."],
    ["Power", "The chance a run of a given size detects a true effect, or excludes one that is not there."]]],
  ["The flights", [
    ["Along the streets", "The shortest street route between two junctions 250–420 m apart, junction by junction, at full stick."],
    ["A straight line", "From one junction to another at full stick, through whatever buildings lie between: the formation meets building after building."],
    ["The replica, its twin", "The 2-D model of the swarm the studies use. A twin is the replica flying a Unity flight again from Unity's own start, on the same route."],
    ["The benches", "Three Unity runs: the first (56 flights a setting, six settings), the follow-up (100 street routes, three settings) and the settling run (300 street routes, 2.0 held and 0.85), whose rule was written before it flew."]]]];
RENDER.terms = el => {
  el.innerHTML = `<div class="intro"><h2>Terms</h2><p>Every term the page uses, in plain words. S9's manual (docs/swarm_spread/README.md) has the method.</p></div>
    <div class="terms">${TERMS.map(([h, items]) => `<div class="box"><h3>${esc(h)}</h3><dl>${items.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl></div>`).join("")}</div>`;
};

$("#answer-box").innerHTML = ANSWER_BOX();
if (!route(location.hash.slice(1))) {
  let first = "answer";
  try { const s = localStorage.getItem("s9rtab"); if (TABS.some(t => t[0] === s)) first = s; } catch (e) { /* storage blocked */ }
  show(first);
}
</script>
